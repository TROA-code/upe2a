<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<style>
doc-page:not(:defined){visibility:hidden}
body{margin:0;background:#eef1f5}
a{color:#1d4e89}
a:hover{color:#14213d}
@media screen{[data-cache="1"]{display:none !important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800&amp;display=swap">

<script src="./bouton-retour.js"></script>
</helmet>
<div class="om-noprint" style="position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid #c3d2e2;padding:68px 18px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:Arial,Helvetica,sans-serif;color:#12233b">
<div style="flex-basis:100%;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid #e3e8ef">
<sc-for list="{{ navGroupes }}" as="ng" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:6px"><span style="flex:0 0 auto;white-space:nowrap;font-size:14px;font-weight:900;color:{{ ng.coul }};margin-right:4px"><sc-for list="{{ ng.lab }}" as="s"><span style="font-family:{{ s.f }};font-weight:{{ s.w }}">{{ s.t }}</span></sc-for></span>
<sc-for list="{{ ng.btns }}" as="nb" hint-placeholder-count="2"><button onClick="{{ nb.go }}" style="width:40px;height:40px;border-radius:50%;border:2.5px solid {{ ng.coul }};background:{{ nb.bg }};color:{{ nb.fg }};font-size:17px;font-weight:900;cursor:pointer">{{ nb.n }}</button></sc-for>
</div>
</sc-for>
<div style="display:flex;gap:6px;margin-left:auto"><button onClick="{{ prec }}" style="width:44px;height:40px;border-radius:8px;border:2px solid #c3d2e2;background:#fff;font-size:16px;cursor:pointer">◀</button><button onClick="{{ suiv }}" style="width:44px;height:40px;border-radius:8px;border:2px solid #c3d2e2;background:#fff;font-size:16px;cursor:pointer">▶</button></div>
</div>
<span style="font-size:15px;font-weight:700">Annexe « exemples pour interroger » :</span>
<button onClick="{{ annexeOui }}" style="border:2px solid {{ bOui }};background:{{ fOui }};color:{{ eOui }};border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer">Je l’imprime</button>
<button onClick="{{ imprimerSeule }}" style="border:2px solid #2a9d6e;background:#2a9d6e;color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer">Imprimer seulement cette grille</button>
<button onClick="{{ annexeNon }}" style="border:2px solid {{ bNon }};background:{{ fNon }};color:{{ eNon }};border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer">Je ne l’imprime pas</button>
</div>
<style>@media print{.om-noprint{display:none !important} body[data-seule] [data-cache="1"]{display:none !important}}</style>
<doc-page size="a4">
<sc-for list="{{ grilles }}" as="g" hint-placeholder-count="2">
<section class="page" data-cache="{{ g.cache }}" data-screen-label="{{ g.label }}" style="display:flex;flex-direction:column;gap:3mm;background:#fff;overflow:hidden;padding:20mm 8mm 20mm 5mm;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#12233b">
<div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid {{ g.coul }};padding-bottom:3mm">

</div>
<sc-for list="{{ g.ceintures }}" as="c" hint-placeholder-count="7">
<div data-rang="1" style="flex:1 1 auto;display:grid;grid-template-columns:26mm minmax(0,1fr);gap:3mm;align-items:center;border-bottom:1px solid #dde2e9;padding:1.2mm 0">
<div style="display:flex;flex-direction:column;align-items:center;gap:1mm">
<svg viewBox="0 0 200 96" width="66" height="32" fill="{{ c.fond }}" stroke="#000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="22" width="184" height="22" rx="3"></rect><path d="M104 44 C 128 58, 148 74, 160 90 L 146 94 C 132 78, 116 62, 100 52 Z"></path><path d="M96 44 C 72 58, 52 74, 40 90 L 54 94 C 68 78, 84 62, 100 52 Z"></path><path d="M82 18 C 78 32, 78 38, 84 48 L 116 48 C 122 38, 122 32, 118 18 Z"></path></svg>
<span style="font-size:12pt;font-weight:700">{{ c.nom }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:1mm">
<sc-for list="{{ c.lignes }}" as="l" hint-placeholder-count="2">
<div style="display:flex;gap:2.5mm;align-items:flex-start;font-size:12pt;line-height:1.18"><span style="flex:0 0 auto;width:4.2mm;height:4.2mm;border:1.8px solid #12233b;border-radius:1mm;margin-top:0.5mm;display:block"></span><span><sc-for list="{{ l.seg }}" as="s"><span style="font-family:{{ s.f }};font-weight:{{ s.w }}">{{ s.t }}</span></sc-for></span></div>
</sc-for>
</div>
</div>
</sc-for>
<div style="flex:0 0 auto;display:flex;justify-content:space-between;font-size:12pt;color:{{ g.coul }}"><span>Nom : ______________________</span><span>UPE2A NSA</span></div>
</section>
</sc-for>
<sc-for list="{{ annexes }}" as="a" hint-placeholder-count="0">
<section class="page" data-cache="{{ a.cache }}" data-screen-label="{{ a.label }}" style="display:flex;flex-direction:column;gap:2.5mm;background:#fff;overflow:hidden;padding:20mm 8mm 20mm 5mm;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#12233b">
<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:1mm;border-bottom:3px solid {{ a.coul }};padding-bottom:2.5mm">
<span style="font-size:12pt;color:#3a4558">Annexe — pour la professeure ou l’élève qui interroge</span>
<span style="font-size:18pt;font-weight:900;color:{{ a.coul }}"><sc-for list="{{ a.titre }}" as="s"><span style="font-family:{{ s.f }};font-weight:{{ s.w }}">{{ s.t }}</span></sc-for> — exemples</span>
</div>
<sc-for list="{{ a.blocs }}" as="b" hint-placeholder-count="7">
<div style="flex:0 0 auto;display:grid;grid-template-columns:24mm minmax(0,1fr);gap:3mm;align-items:start;border-bottom:1px solid #dde2e9;padding-bottom:2mm">
<span style="display:flex;align-items:center;gap:1.5mm;font-size:12pt;font-weight:700"><span style="flex:0 0 auto;width:6mm;height:4mm;border:1px solid #12233b;border-radius:1mm;background:{{ b.fond }};display:block"></span>{{ b.nom }}</span>
<div style="display:flex;flex-direction:column;gap:0.8mm;font-size:12pt;line-height:1.25">
<sc-for list="{{ b.ex }}" as="e" hint-placeholder-count="2"><span><sc-for list="{{ e.seg }}" as="s"><span style="font-family:{{ s.f }};font-weight:{{ s.w }}">{{ s.t }}</span></sc-for></span></sc-for>
</div>
</div>
</sc-for>
</section>
</sc-for>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* 13/10 ESSAI : l'ORAL coupé en J'écoute (CO) et Je parle (PO), grille 1, 2 lignes max par ceinture.
   Ses phrases reprises ; ajouts tirés de la grille Parlera. À valider avant la mise au propre (pictos à venir). */
const SERIF = "'Roboto Slab', 'Times New Roman', Georgia, serif";
const IJ = t => String(t).split(/([IJ])/).filter(Boolean).map(x => { const ij = /^[IJ]$/.test(x); return { t: x, f: ij ? SERIF : 'inherit', w: ij ? '800' : 'inherit' }; });
const FOND = { Blanche: '#ffffff', Jaune: '#f5e663', Orange: '#f4a76a', Verte: '#9ad48c', Bleue: '#8fb8f0', Marron: '#b87a4a', Noire: '#2b2b2b' };
const G = [
  ['J’ÉCOUTE', '#1b8a3a', [
    ['Blanche', ['Je comprends les consignes de la classe.', 'Je montre l’image du mot repère que j’entends.']],
    ['Jaune', ['Je comprends les questions sur moi : nom, âge, ville, pays.']],
    ['Orange', ['Je comprends un nombre, un prix, une heure dits lentement.']],
    ['Verte', ['Je comprends une description : je montre la bonne image ou la bonne personne.']],
    ['Bleue', ['J’écoute une histoire de 3 ou 4 phrases.', 'Je réponds à qui ? où ? quoi ?']],
    ['Marron', ['Je fais 2 actions dans l’ordre.']],
    ['Noire', ['Je comprends un message court d’une personne que je ne connais pas (une annonce, un message vocal).']]]],
  ['JE PARLE', '#0f6b5c', [
    ['Blanche', ['Je dis le nom de mes mots repères.', 'Je répète des mots et des petites phrases.']],
    ['Jaune', ['Je me présente : nom, âge, ville, pays, langue.', 'J’épèle mon nom et mon prénom.']],
    ['Orange', ['Je pose une question et je réponds par une petite phrase.', 'Je demande, je remercie, je m’excuse, je refuse.']],
    ['Verte', ['Je décris une image, une personne, un objet.', 'Je parle de l’école, de la maison, de l’atelier.']],
    ['Bleue', ['Je raconte une histoire connue avec des images.', 'Je tiens un rôle dans un sketch (au restaurant).']],
    ['Marron', ['Je participe à un échange : j’attends mon tour.', 'Je réponds par une phrase complète.']],
    ['Noire', ['Je raconte ce qui m’est arrivé (hier, en stage).', 'Je suis compris par quelqu’un qui ne me connaît pas (web radio).']]]]];
/* 13/10 : annexe « exemples pour interroger » (sa demande), imprimée ou non — choix gardé en localStorage. */
const EX = {
  'J’ÉCOUTE': [
    ['Blanche', ['« Assieds-toi. » « Prends ton stylo. » « Ouvre ton cahier. » « Lève-toi. » « Écoute. »', '4 images de mots repères (ananas, ballon, moto, jupe…) : « Montre-moi la moto… l’ananas… »']],
    ['Jaune', ['Il répond, même par un mot : « Comment tu t’appelles ? » « Tu as quel âge ? » « Tu habites où ? » « Tu viens de quel pays ? »']],
    ['Orange', ['Il montre ou écrit le chiffre : « Le bus arrive à 8 heures. » « Le sandwich coûte 3 euros. » « Ton rendez-vous est à 14 heures. » « Salle 218. »']],
    ['Verte', ['Il montre la bonne image parmi 3 : « Il a un pull rouge et des lunettes. » « C’est une femme, elle a les cheveux longs. » « C’est petit, c’est rond, on mange ça. »']],
    ['Bleue', ['Tu lis : « Karim va à la boulangerie. Il achète du pain. Il paie 1 euro. »', 'Puis : « Qui ? » → Karim. « Où ? » → à la boulangerie. « Quoi ? » → du pain.', 'C’est réussi : 2 réponses justes sur 3 (un mot ou une image suffit).']],
    ['Marron', ['« Prends ton cahier, puis ouvre-le. » « Va à la porte, puis ferme-la. » « Écris ton prénom, puis donne la feuille à Ahmed. »', 'C’est réussi : 2 consignes sur 3, dans le bon ordre. On peut répéter une fois.']],
    ['Noire', ['Message vocal d’un collègue : « Bonjour, c’est le secrétariat. Ton rendez-vous de jeudi est déplacé à vendredi, 10 heures. »', 'Puis : « Quel jour ? À quelle heure ? »']]],
  'JE PARLE': [
    ['Blanche', ['Une image de mot repère : « Qu’est-ce que c’est ? » → « un ananas », « une moto »…', '« Répète : Bonjour madame. » « Je m’appelle… » « Merci. »']],
    ['Jaune', ['« Présente-toi. » → nom, âge, ville, pays, langue.', '« Épèle ton prénom. » « Épèle ton nom. »']],
    ['Orange', ['« Demande à Sumaya son âge. »', '« Tu n’as pas de stylo : tu dis quoi ? » « Tu es en retard : tu dis quoi ? » « On t’offre un café, tu n’en veux pas : tu dis quoi ? »']],
    ['Verte', ['Image d’une cuisine : « Décris l’image. »', '« Parle-moi de ta maison. » « Qu’est-ce que tu fais à l’atelier ? »']],
    ['Bleue', ['Les 4 images de Roule Galette : « Raconte l’histoire. »', 'Sketch du restaurant, tu es le serveur : « Bonjour, qu’est-ce que vous prenez ? »']],
    ['Marron', ['À 3 ou 4 : « Qu’est-ce que vous aimez manger ? »', 'Attend-il son tour ? Phrase complète (« J’aime le riz », pas « riz ») ?']],
    ['Noire', ['« Qu’est-ce que tu as fait hier ? » « Raconte-moi ton stage. »', 'Web radio : un message de 30 secondes, écouté par un collègue qui ne le connaît pas. Comprend-il ?']]]};

/* 13/10 : GRILLE 2 (cycle 2) de l'oral, coupée — proposée, à valider. Repère école seulement côté prof. */
const G2 = [
  ['J’ÉCOUTE', '#1b8a3a', [
    ['Blanche', ['J’écoute un message d’1 minute et je dis l’essentiel : qui ? quoi ?']],
    ['Jaune', ['J’écoute une recette ou une règle de jeu et je la fais.']],
    ['Orange', ['J’écoute une leçon et je redis 3 étapes dans l’ordre : d’abord, ensuite, enfin.']],
    ['Verte', ['J’entends si on parle au passé, au présent ou au futur.']],
    ['Bleue', ['J’écoute un message de 3 minutes (radio, vidéo) et je réponds à 3 questions.']],
    ['Marron', ['Je redis avec mes mots ce qu’a dit un camarade.']],
    ['Noire', ['Au téléphone, je comprends un message.', 'Je note le jour, l’heure et le lieu.']]]],
  ['JE PARLE', '#0f6b5c', [
    ['Blanche', ['Je dis de mémoire un texte court (poème, chanson) en articulant.']],
    ['Jaune', ['Je raconte ma journée en 4 phrases.', 'Je donne mon avis : « J’aime… parce que… »']],
    ['Orange', ['Je raconte avec d’abord, ensuite, enfin.']],
    ['Verte', ['Je raconte hier (passé composé) et demain (« je vais… »).']],
    ['Bleue', ['J’explique une recette ou un geste d’atelier, avec les bons mots.']],
    ['Marron', ['Je dis si je suis d’accord ou pas, et pourquoi.']],
    ['Noire', ['Je joue une situation de travail : accueillir un client, répondre au téléphone.']]]]];
const EX2 = {
  'J’ÉCOUTE': [
    ['Blanche', ['Tu dis : « Demain, Sania va à la piscine avec sa sœur. » Puis : « Qui ? » → Sania. « Quoi ? » → la piscine.', 'C’est réussi : les 2 réponses justes.']],
    ['Jaune', ['Tu lis la recette du jus d’orange en 3 étapes (couper, presser, verser) ; il fait les gestes.', 'Ou la règle du memory : « Tu retournes 2 cartes. Si c’est pareil, tu gardes. »']],
    ['Orange', ['Tu expliques : « D’abord je me lave les mains, ensuite je mets mon tablier, enfin je prends mon couteau. »', 'Il redit les 3 étapes dans l’ordre.']],
    ['Verte', ['« Hier, j’ai mangé du riz. » « Je mange du riz. » « Demain, je vais manger du riz. »', 'Il montre l’étiquette HIER / AUJOURD’HUI / DEMAIN. C’est réussi : 4 phrases sur 5.']],
    ['Bleue', ['Un extrait de 3 minutes de la web radio de la classe ou un reportage court.', '3 questions : qui parle ? de quoi ? où ? C’est réussi : 2 sur 3.']],
    ['Marron', ['Yasir raconte son week-end en 3 phrases. Tu demandes : « Qu’est-ce qu’il a dit ? »', 'Il redit l’essentiel avec ses mots (« il dit que… »).']],
    ['Noire', ['Message : « Bonjour, c’est le garage Martin. Ton stage commence lundi 3 novembre, à 8 h 30, au 12 rue de Paris. »', 'Il note : lundi 3 novembre, 8 h 30, 12 rue de Paris.']]],
  'JE PARLE': [
    ['Blanche', ['Un poème ou une chanson appris en classe (4 vers), dit seul devant le groupe.', 'Les mots sont bien articulés : on comprend chaque mot.']],
    ['Jaune', ['« Raconte ta journée. » → « Je me lève. Je prends le bus. Je vais au lycée. Je mange à la cantine. »', '« Tu aimes le foot ? » → « J’aime le foot parce que… »']],
    ['Orange', ['« Comment tu fais un thé ? » → « D’abord je chauffe l’eau, ensuite je mets le sachet, enfin je bois. »']],
    ['Verte', ['« Qu’est-ce que tu as fait hier ? » → « Hier, j’ai regardé un film. »', '« Qu’est-ce que tu vas faire demain ? » → « Demain, je vais aller au lycée. »']],
    ['Bleue', ['« Explique comment on met la table. » « Explique comment on coupe un oignon. »', 'Il utilise les mots du métier (assiette, fourchette, couteau, planche).']],
    ['Marron', ['« Le portable est interdit en classe : d’accord ou pas d’accord ? »', '« Je suis d’accord parce que… » / « Je ne suis pas d’accord parce que… »']],
    ['Noire', ['Tu es le client, il est le serveur : « Bonjour, une table pour deux, s’il vous plaît. »', 'Tu appelles : « Allô, je voudrais parler au chef. » Il répond poliment et prend le message.']]]};
/* 13/10 : GRILLE 3 de l'oral (d'après ses notes « Oral — Grille 3 (cycle 3) »), coupée, 2 lignes max — à valider. */
const G3 = {
  'J’ÉCOUTE': [
    ['Blanche', ['J’écoute avec un but : je note une information ou je réponds à une question.']],
    ['Jaune', ['Je comprends une interview ou un reportage court.', 'Je dis de quoi ça parle.']],
    ['Orange', ['Je reconnais ce que j’entends : une information, une histoire, une publicité, un avis.']],
    ['Verte', ['Je dis ce que je ressens après avoir écouté un texte.', 'Je redis avec mes mots ce qui est dit, et ce qui est sous-entendu.']],
    ['Bleue', ['J’écoute un exposé de 5 minutes et je note les idées principales.']],
    ['Marron', ['Pendant un échange, je tiens compte de ce qui a été dit avant moi.']],
    ['Noire', ['Je comprends les questions d’un entretien (stage, orientation) sans qu’on répète.']]],
  'JE PARLE': [
    ['Blanche', ['Je raconte, j’explique ou je donne mon avis clairement et dans l’ordre.']],
    ['Jaune', ['Je lis un texte à voix haute en mettant le ton.']],
    ['Orange', ['J’adapte ma façon de parler à la personne : un camarade, une professeure, un client.']],
    ['Verte', ['Je donne une information ou une explication.', 'Je réponds aux questions sur ce que j’ai dit.']],
    ['Bleue', ['Je lis devant le groupe, clairement, un poème ou un document.']],
    ['Marron', ['Je réponds à une question de façon claire et ordonnée.', 'Je dis ce qui était bien et moins bien dans mon oral.']],
    ['Noire', ['Je défends mon avis dans un débat, avec des arguments.', 'En entretien (stage, orientation), je me présente, je réponds, je pose des questions.']]]};
const EX3 = {
  'J’ÉCOUTE': [
    ['Blanche', ['Avant d’écouter : « Note l’heure du train. » Annonce : « Le train pour Rouen partira à 14 h 12, voie 3. »', 'Il note 14 h 12.']],
    ['Jaune', ['Une interview de 2 minutes (un boulanger qui parle de son métier).', '« De quoi ça parle ? » → du métier de boulanger, du pain, des horaires.']],
    ['Orange', ['4 extraits courts : une météo, un conte, une publicité, un avis sur un film.', 'Pour chacun : « C’est quoi ? » C’est réussi : 3 sur 4.']],
    ['Verte', ['Tu lis un poème ou une histoire courte. « Qu’est-ce que tu ressens ? » → « C’est triste parce que… »', '« Pourquoi il ne dit rien ? » → il répond avec ce qui n’est pas dit.']],
    ['Bleue', ['Un camarade fait un exposé de 5 minutes sur son pays.', 'Il note 3 idées principales.']],
    ['Marron', ['Débat à 4 : « Le portable au lycée ». Avant de parler, il reprend ce qui a été dit : « Ahmed dit que…, moi je pense que… »']],
    ['Noire', ['Simulation d’entretien de stage : « Pourquoi ce métier ? » « Quels sont vos horaires possibles ? »', 'Il répond sans demander de répéter.']]],
  'JE PARLE': [
    ['Blanche', ['« Explique comment tu viens au lycée. » ou « Tu préfères la ville ou la campagne ? Pourquoi ? »', 'Il parle 1 minute, dans l’ordre (d’abord, ensuite, enfin).']],
    ['Jaune', ['Un texte préparé de 10 lignes, lu à voix haute.', 'Il respecte les points et met le ton (question, surprise, colère).']],
    ['Orange', ['La même demande, 3 fois : à un camarade (« T’as un stylo ? »), à la professeure (« Vous auriez un stylo ? »), à un client (« Je peux vous aider ? »).']],
    ['Verte', ['« Explique comment fonctionne la cantine du lycée. »', 'Puis 2 questions des camarades : il répond.']],
    ['Bleue', ['Devant le groupe : un poème appris ou un document de 10 lignes.', 'On comprend chaque mot, il regarde le public.']],
    ['Marron', ['« Pourquoi tu veux faire ce métier ? » → réponse en 3 parties.', 'Puis : « Qu’est-ce qui était bien ? Qu’est-ce que tu changerais ? »']],
    ['Noire', ['Débat : « Faut-il un uniforme au lycée ? » → 2 arguments.', 'Entretien de stage joué : il se présente, il répond, il pose 2 questions (horaires, tenue).']]]};

rit).","Écrit court : « Donne ton avis sur le film » (3 phrases), au brouillon d’abord.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Jaune",["Un document (fiche d’un métier) : il note 5 informations utiles.","« Pourquoi tu aimes ce métier ? » en 5 phrases ; tu donnes 2 pistes, il améliore.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Orange",["« Décris ta cuisine » puis « Écris un dialogue entre un client et un serveur ».","La leçon du jour en schéma ; le texte garde le même temps et les mêmes personnes.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Verte",["Deux documents sur le même sujet : « Qu’est-ce qui est pareil ? différent ? » par écrit.","Une page seul, puis il relit avec la grille et réécrit.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Bleue",["Copie d’un texte de 15 lignes, lisible, sans faute.","Résumé d’un texte en 5 lignes ; récit : « Raconte ton arrivée en France. »","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Marron",["« Faut-il un uniforme au lycée ? » : 2 arguments avec « parce que », « donc », dans un ordre logique.","Il révise son texte : majuscules, points, accords, paragraphes.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]],["Noire",["Le compte rendu de sa PFMP (1 à 2 pages) : l’entreprise, ses tâches, ce qu’il a appris.","Relu et corrigé, écrit pour le professeur ou le tuteur.","Toujours : les mots surlignés de la dictée de la semaine, dictés sans les voir. Sans eux, pas de ceinture."]]]];
const EXO = [["Blanche",["Il range son cahier dans le bon bac, sa feuille dans la bonne pochette, sans qu’on le lui dise.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Jaune",["« Sortez le cahier de lecture. » Il le sort tout de suite.","« Colle la feuille. » Il la colle au bon endroit, à la bonne page, droite.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Orange",["La consigne est donnée une fois : il commence seul dans la minute.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Verte",["Il a fini avant les autres : il range, relit son travail, puis prend un atelier autonome sans demander.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Bleue",["Il bloque : il demande d’abord à un camarade, puis à toi. Il ne reste pas sans rien faire, il ne demande pas toutes les 2 minutes.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Marron",["Il montre à un camarade où ranger sa feuille, quel cahier sortir, à quelle page coller.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]],["Noire",["À la fin du cours, il range la classe : les bacs, les étiquettes, les tablettes, sans qu’on le lui demande.","Toujours, toute la semaine : il est arrivé à l’heure, il avait ses affaires, il a pris soin du matériel. Sinon, pas de ceinture."]]];
const DOM = [
  { lab: 'JE LIS', coul: '#1a4fc4', grilles: LE.L.map((g, i) => ({ num: i + 1, sous: g.sous, cs: g.cs, ex: EXL[i] })) },
  { lab: 'J’ÉCRIS', coul: '#c8102e', grilles: LE.E.map((g, i) => ({ num: i + 1, sous: g.sous, cs: g.cs, ex: EXE[i] })) },
  /* 13/10 : Étude de la langue retirée (elle la met à part) — données gardées dans LE.La. */
  { lab: 'J’ÉCOUTE', coul: '#1b8a3a', grilles: [{ num: 1, sous: 'J’entre dans le français', cs: G[0][2], ex: EX['J’ÉCOUTE'] }, { num: 2, sous: 'Je progresse', cs: G2[0][2], ex: EX2['J’ÉCOUTE'] }, { num: 3, sous: 'Je deviens autonome', cs: G3['J’ÉCOUTE'], ex: EX3['J’ÉCOUTE'] }] },
  { lab: 'JE PARLE', coul: '#0f6b5c', grilles: [{ num: 1, sous: 'J’entre dans le français', cs: G[1][2], ex: EX['JE PARLE'] }, { num: 2, sous: 'Je progresse', cs: G2[1][2], ex: EX2['JE PARLE'] }, { num: 3, sous: 'Je deviens autonome', cs: G3['JE PARLE'], ex: EX3['JE PARLE'] }] }];
/* 13/10 : une grille trop chargée pour une page A4 à 12 pt (Langue 2 et 3) passe sur DEUX pages au lieu d'être coupée. */

const PAGES = DOM.flatMap(d => d.grilles.flatMap(g => { const n = g.cs.reduce((s, c) => s + c[1].length, 0);
  return n > 23 ? [{ d, g, cs: g.cs.slice(0, 4), suite: '' }, { d, g, cs: g.cs.slice(4), suite: ' (suite)' }] : [{ d, g, cs: g.cs, suite: '' }]; }));
const CLE = 'ceintures-oral-annexe', CLE_SEL = 'ceintures-grille-v2';
class Component extends DCLogic {
  state = { sel: (() => { try { const v = +(localStorage.getItem(CLE_SEL) || 0); return v >= 0 && v < PAGES.length ? v : 0; } catch (e) { return 0; } })(),
    annexe: (() => { try { return localStorage.getItem(CLE) !== 'non'; } catch (e) { return true; } })() };
  aller(i) { const n = PAGES.length; let k = ((i % n) + n) % n; if (PAGES[k].suite) k = ((i > this.state.sel ? k + 1 : k - 1) + n) % n; try { localStorage.setItem(CLE_SEL, String(k)); } catch (e) {} this.setState({ sel: k }); window.scrollTo({ top: 0 }); }
  componentDidMount() { this._kb = e => { if (e.key === 'ArrowRight') this.aller(this.state.sel + 1); if (e.key === 'ArrowLeft') this.aller(this.state.sel - 1); }; document.addEventListener('keydown', this._kb); }
  componentWillUnmount() { document.removeEventListener('keydown', this._kb); }
  choisir(v) { try { localStorage.setItem(CLE, v ? 'oui' : 'non'); } catch (e) {} this.setState({ annexe: v }); }
  renderVals() {
    const { sel, annexe: on } = this.state, pill = a => a ? { b: '#2a9d6e', f: '#2a9d6e', e: '#fff' } : { b: '#c3d2e2', f: '#fff', e: '#12233b' };
    const po = pill(on), pn = pill(!on);
    const navGroupes = DOM.map(d => ({ lab: IJ(d.lab), coul: d.coul, btns: d.grilles.map(g => { const idx = PAGES.findIndex(p => p.g === g);
      return { n: g.num, go: () => this.aller(idx), bg: idx === sel ? d.coul : '#fff', fg: idx === sel ? '#fff' : d.coul }; }) }));
    return { navGroupes, prec: () => this.aller(sel - 1), suiv: () => this.aller(sel + 1),
      /* 14/10 : imprimer la seule grille affichée (et son annexe si « oui ») ; le bouton vert du haut imprime tout. */
      imprimerSeule: () => { const b = document.body; b.setAttribute('data-seule', '1'); const fin = () => { b.removeAttribute('data-seule'); window.removeEventListener('afterprint', fin); }; window.addEventListener('afterprint', fin); window.print(); },
      annexeOui: () => this.choisir(true), annexeNon: () => this.choisir(false),
      bOui: po.b, fOui: po.f, eOui: po.e, bNon: pn.b, fNon: pn.f, eNon: pn.e,
      grilles: PAGES.map(({ d, g, cs, suite }, k) => ({ label: d.lab + ' ' + g.num + suite, num: g.num, titre: IJ(d.lab), coul: d.coul, sous: IJ(g.sous + suite), cache: (k === sel || (suite && PAGES[k - 1] && k - 1 === sel)) ? '0' : '1',
        ceintures: cs.map(([nom, ls]) => ({ nom, fond: FOND[nom], lignes: ls.map(l => ({ seg: IJ(l) })) })) })),
      annexes: !on ? [] : PAGES.map((p, k) => ({ p, k })).filter(x => x.p.g.ex && !x.p.suite).map(({ p: { d, g }, k }) => ({ label: 'Annexe ' + d.lab + ' ' + g.num, titre: IJ(d.lab + ' — grille ' + g.num), coul: d.coul, cache: k === sel ? '0' : '1',
        blocs: g.ex.map(([nom, ex]) => ({ nom, fond: FOND[nom], ex: ex.map(x => ({ seg: IJ(x) })) })) })) };
  }
}
