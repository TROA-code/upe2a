<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a9d6e"/><text x="50" y="64" font-size="40" text-anchor="middle" fill="#fff" font-family="sans-serif">a</text></svg></template>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" />
<script src="./alphabet2-images.js"></script>
<style>
@font-face{font-family:'BA Script';src:url('fonts/BelleAllureScript2i-Gros.otf') format('opentype');font-display:block}
body{margin:0;background:#fdfbef;font-family:Archivo, sans-serif}
a{color:#1682a0}
a:hover{color:#12233b}
@keyframes tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes battement{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#fdfbef">
<div style="flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px 22px;background:#2a9d6e;color:#fff">
<span style="font-family:'BA Script', Archivo, sans-serif;font-size:34px;line-height:1">a</span>
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:18px;letter-spacing:0.04em;text-transform:uppercase">L’alphabet</span>
<span style="margin-left:auto;font-size:12px;opacity:0.85">version 3</span>
</div>

<sc-if value="{{ enJeu }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 22px 0">
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#8a4b1e">{{ serieTexte }}</span>
<button onClick="{{ direConsigne }}" title="Écouter la consigne" style="flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:#f08a24;color:#fff;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 2px 0 #c96f14">&#9658;</button>
<span style="flex:1;min-width:220px;font-size:17px;color:#14213d;text-wrap:pretty"><b>Touche</b> la lettre. Puis <b>touche</b> son image repère.</span>
</div>
<div style="display:grid;grid-template-columns:repeat({{ nbLettres }},minmax(0,1fr));gap:6px">
<sc-for list="{{ lettres }}" as="a" hint-placeholder-count="9">
<button onClick="{{ a.choisir }}" style="border:{{ a.epaisseur }} solid {{ a.bord }};border-radius:10px;background:{{ a.fond }};padding:16px 0 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:visible">
<span style="font-family:'BA Script', Archivo, sans-serif;font-size:38px;line-height:1.05;color:{{ a.couleur }}">{{ a.l }}</span>
</button>
</sc-for>
</div>
<div style="height:3px;border-radius:2px;background:#14213d"></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;align-content:start;padding-bottom:18px">
<sc-for list="{{ images }}" as="g" hint-placeholder-count="9">
<button onClick="{{ g.choisir }}" style="border:{{ g.epaisseur }} solid {{ g.bord }};border-radius:10px;background-color:{{ g.fond }};height:120px;padding:5px;opacity:{{ g.visible }};pointer-events:{{ g.clics }};animation:{{ g.anim }};cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden">
<sc-for list="{{ g.photos }}" as="p" hint-placeholder-count="1">
<img src="{{ p }}" alt="" draggable="false" style="flex:1 1 0;min-width:0;max-height:100%;object-fit:contain;display:block;pointer-events:none" />
</sc-for>
</button>
</sc-for>
</div>
<div style="display:flex;align-items:center;justify-content:flex-end;border-top:1px solid #e4dfc8;padding:10px 0 14px;min-height:46px">
<sc-if value="{{ serieFinie }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ suivant }}" style="border:none;border-radius:11px;background:#f08a24;color:#fff;padding:14px 28px;font-family:Archivo Black, Archivo, sans-serif;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 #c96f14">{{ libelleSuivant }}</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ estFin }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:64px;color:#2a9d6e;letter-spacing:0.02em">BRAVO !</span>
<sc-if value="{{ aDures }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #e4dfc8;border-radius:12px;padding:12px 22px">
<span style="font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#8a4b1e;font-weight:700">À revoir</span>
<span style="font-family:'BA Script', Archivo, sans-serif;font-size:34px;letter-spacing:0.12em;color:#12233b">{{ dures }}</span>
</div>
</sc-if>
<button onClick="{{ recommencer }}" style="border:none;border-radius:11px;background:#f08a24;color:#fff;padding:15px 30px;font-family:Archivo Black, Archivo, sans-serif;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 #c96f14">Recommencer</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Alphabet 2 (a script) en fichier ISOLÉ (10/10, sa demande) : aucune sortie, pas de compteur
   ni de chrono. Mêmes paires que ALPHA_IMG de l'espace enseignant (le h est écarté). */
const ITEMS=[['a','ananas','ANANAS'],['b','ballon','BALLON'],['c','carotte','CAROTTE et CERISE','cerise'],['d','deux','DEUX'],['e','je','JE'],['f','fenetre','FENÊTRE'],['g','gateau','GÂTEAU et GILET','gilet'],['i','immeuble','IMMEUBLE'],['j','jaune','JAUNE'],['k','kiwi','KIWI'],['l','lit','LIT'],['m','moto','MOTO'],['n','nuage','NUAGE'],['o','ordinateur','ORDINATEUR et POT','pot'],['p','pied','PIED'],['q','quatre','QUATRE'],['r','robot','ROBOT'],['s','salade','SALADE et ROSE','rose'],['t','table','TABLE'],['u','usine','USINE'],['v','velo','VÉLO'],['w','wagon','WAGON'],['x','xylophone','XYLOPHONE'],['y','pyjama','PYJAMA'],['z','zero','ZÉRO']];
/* 10/10 : en ligne, le fichier est dans github/ et les photos de l'appli dans ../clean/. */
/* 10/10 : les photos incluses sont converties UNE fois en adresses courtes (blob:) — une
   data-URI de 100 Ko relue à chaque toucher faisait disparaître les images. En ligne, repli
   sur ../clean/ (le fichier est dans github/). */
const BLOBS={};
const src=f=>{
  if(BLOBS[f]) return BLOBS[f];
  const d=window.ALPHA2_IMG&&window.ALPHA2_IMG[f];
  if(d){ try{ const b=atob(d.split(',')[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return BLOBS[f]=URL.createObjectURL(new Blob([u],{type:'image/webp'})); }catch(e){ return BLOBS[f]=d; } }
  return (/\/github\//.test(location.pathname)?'../':'')+'clean/mot-'+f+'.webp';
};
const BORNES=[[0,9],[9,18],[18,25]];
class Component extends DCLogic {
  state={serie:0,fin:false,lettreSel:'',imageSel:'',trouves:[],tremble:'',errSerie:{},errTotal:{},tour:0};
  componentDidMount(){ let n=0; this._attente=setInterval(()=>{ n++; if(window.ALPHA2_IMG||n>40){ clearInterval(this._attente); this.forceUpdate(); } },150); }
  componentWillUnmount(){ clearInterval(this._attente); }
  melange(a){ const c=[...a]; for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];} return c; }
  lot(){ const b=BORNES[this.state.serie]; return ITEMS.slice(b[0],b[1]); }
  nom(l){ const p=ITEMS.find(x=>x[0]===l); return l.toUpperCase()+' de '+p[2]; }
  voix(){
    try{
      const note=v=>{ const n=v.name||''; let p=0;
        if(/natural|premium|enhanced|siri|neural/i.test(n)) p+=100; if(/google/i.test(n)) p+=60;
        if(/hortense|caroline|virginie|julie/i.test(n)) p-=25; if(/thomas|henri|denise|audrey|marie|amelie|am\u00e9lie/i.test(n)) p+=20;
        if(v.localService) p+=10; if(/compact|espeak|festival|robot/i.test(n)) p-=50; return p; };
      return (speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(v.lang||'')).sort((a,b)=>note(b)-note(a))[0]||null;
    }catch(e){ return null; }
  }
  dire(t){ try{ const u=new SpeechSynthesisUtterance(String(t)); u.lang='fr-FR'; u.rate=0.85; const v=this.voix(); if(v){u.voice=v;u.lang=v.lang;} speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  carillon(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*0.13; o.frequency.value=f; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.4); }); }catch(e){} }
  reussi(l){ this.setState(p=>({trouves:[...p.trouves,l],lettreSel:'',imageSel:'',tremble:''})); this.dire(this.nom(l)); }
  rate(cible){
    this.setState(p=>({tremble:cible,imageSel:'',errSerie:{...p.errSerie,[cible]:(p.errSerie[cible]||0)+1},errTotal:{...p.errTotal,[cible]:(p.errTotal[cible]||0)+1}}));
    setTimeout(()=>this.setState({tremble:''}),450);
  }
  choisirLettre(l){
    const s=this.state; if(s.trouves.includes(l)) return;
    if(s.imageSel){
      const c=s.imageSel;
      if(l===c) this.reussi(c); else { this.rate(c); this.dire('Essaie encore. \u00c7a, c\u2019est '+this.nom(c)+'.'); }
      return;
    }
    this.setState({lettreSel:l}); this.dire(l);
  }
  choisirImage(l){
    const s=this.state; if(s.trouves.includes(l)) return;
    if(!s.lettreSel){ this.setState({imageSel:l}); this.dire('Maintenant, touche la lettre.'); return; }
    if(l===s.lettreSel){ this.reussi(l); return; }
    const cle=s.lettreSel;
    this.setState(p=>({tremble:l,errSerie:{...p.errSerie,[cle]:(p.errSerie[cle]||0)+1},errTotal:{...p.errTotal,[cle]:(p.errTotal[cle]||0)+1}}));
    setTimeout(()=>this.setState({tremble:''}),450);
    this.dire('Essaie encore. \u00c7a, c\u2019est '+this.nom(l)+'.');
  }
  suivant(){
    this.carillon();
    if(this.state.serie>=2){ this.setState({fin:true}); this.dire('Bravo !'); return; }
    this._ordre=null;
    this.setState(p=>({serie:p.serie+1,lettreSel:'',imageSel:'',trouves:[],errSerie:{},tremble:''}));
  }
  renderVals(){
    const s=this.state, lot=this.lot(), tr=s.trouves;
    const cle=s.tour+'|'+s.serie;
    if(!this._ordre||this._cle!==cle){ this._cle=cle; this._ordre=this.melange(lot); }
    const err=s.errSerie[s.lettreSel]||0;
    const dures=Object.keys(s.errTotal).filter(l=>s.errTotal[l]>=3);
    return {
      enJeu:!s.fin, estFin:s.fin,
      serieTexte:'Série '+(s.serie+1)+' / 3',
      nbLettres:lot.length,
      direConsigne:()=>this.dire('Touche la lettre. Puis touche son image rep\u00e8re.'),
      lettres:lot.map(([l])=>({
        l,
        couleur:tr.includes(l)?'#b7c0cc':('aeiouy'.includes(l)?'#d63c2f':'#12233b'),
        fond:tr.includes(l)?'#eef1f5':(s.lettreSel===l?'#fff6cc':'#fff'),
        bord:s.lettreSel===l?'#f08a24':'#ccd4de',
        epaisseur:s.lettreSel===l?'4px':'2px',
        choisir:()=>this.choisirLettre(l)
      })),
      images:this._ordre.map(([l,f,mot,f2])=>({
        photos:f2?[src(f),src(f2)]:[src(f)],
        visible:tr.includes(l)?'0':'1', clics:tr.includes(l)?'none':'auto',
        bord:s.imageSel===l?'#f08a24':'#ccd4de',
        epaisseur:s.imageSel===l?'4px':'2px',
        fond:s.imageSel===l?'#fff6cc':'#fff',
        anim:s.tremble===l?'tremble 0.45s':((err>=3&&l===s.lettreSel)?'battement 1s infinite':'none'),
        choisir:()=>this.choisirImage(l)
      })),
      serieFinie:tr.length>=lot.length,
      suivant:()=>this.suivant(),
      libelleSuivant:s.serie>=2?'J’ai fini':'Continuer',
      aDures:dures.length>0, dures:dures.join(' '),
      recommencer:()=>{ this._ordre=null; this.setState(p=>({serie:0,fin:false,lettreSel:'',imageSel:'',trouves:[],tremble:'',errSerie:{},errTotal:{},tour:p.tour+1})); }
    };
  }
}
</script>
</body>
</html>
