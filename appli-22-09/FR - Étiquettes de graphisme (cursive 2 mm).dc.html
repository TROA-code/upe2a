/* Étiquettes de graphisme en cursive, d'après son modèle du 15/09 : une réglure de couleur
   par zone — ciel (au-dessus de l'herbe : les boucles hautes et les capitales), herbe
   (le corps des minuscules), terre (les jambages) — et la lettre écrite deux fois.
   Une feuille A4 paysage = 48 étiquettes à découper et à coller dans le cahier.

   ⚠ Le regroupement est LE SIEN, colonne par colonne (familles de ductus). Certaines
   lettres reviennent (u, h, g, v, s, l) : c'est voulu dans son modèle, ne pas « nettoyer ».
   ⚠ Les bandes sont des aplats de couleur, pas les photos de ciel / gazon / terre de son
   modèle : je n'ai pas ces images. Le code couleur est celui du cahier d'écriture de
   l'appli (bleu ciel · gris · vert minuscules · marron ligne · rouge jambages), donc
   l'élève retrouve la même réglure partout.
   ⚠ VERSION 2 mm — celle du cahier Seyes ORDINAIRE (CE1 et au-delà, tous les autres
   cahiers du lycée). Son jumeau « 3 mm » est la version cahier Seyes agrandi, pour
   démarrer le geste. Les deux existent volontairement, ne pas en supprimer un.
   Échelle : 1 unité = 0,1 mm exactement (viewBox 365 de large pour 36,5 mm de case),
   donc corps 20 u = 2 mm, font-size 46, jambages 19 u, boucles hautes 57 u.
   Lignes : 3 / 21 / 40 / 60 (ligne d'écriture) / 79 / 98. */

/* ⚠ Les 48 étiquettes sont écrites EN DUR dans le gabarit, pas produites par un sc-for.
   Raison (bug du 15/09) : un {{ hole }} dans un <text> SVG est enveloppé dans un
   <span class="sc-interp">, et un <span> HTML n'est pas un enfant rendu par SVG <text>
   (seuls les nœuds texte et <tspan> le sont) : les 48 étiquettes sortaient VIDES, réglure
   et bandes visibles, aucune lettre. Ne pas « factoriser » ce gabarit avec un sc-for.
   La réglure, elle, est mutualisée par <use href="#reg"> sur un <defs> en tête de page. */
/* Ordre des étiquettes, pour mémoire seulement — il est écrit en dur dans le gabarit,
   colonne par colonne comme sur son modèle :
     a o i u · e l b h · j g z y · m n v u · r s c x · t d h k
     1 2 3 4 · 5 6 7 8 · 9 v w u · p q g s · l f g h · 0 é è ç
   Certaines lettres reviennent (u, h, g, v, s, l) : c'est voulu. */

class Component extends DCLogic {
  renderVals() {
    return {
      /* Bouton Imprimer à l'écran, masqué au moment d'imprimer (.om-noprint). */
      imprimer: () => window.print(),
      avecTitre: this.props.avecTitre ?? true,
      titre: this.props.titre ?? "J'écris les lettres en attaché — réglure 2 mm"
    };
  }
}
