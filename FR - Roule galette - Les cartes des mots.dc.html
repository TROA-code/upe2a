<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<script src="roule-galette-mots.js"></script>
<style>body{margin:0;font-family:Andika, Archivo, Verdana, sans-serif;color:#12233b}a{color:#1d4e89}a:hover{color:#12233b}@media print{.bouton{display:none !important}}</style>
</helmet>
<button class="bouton" onClick="{{ retour }}" style="position:fixed;top:12px;right:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">← Retour</button>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" hint-size="100%,100%">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
<section class="page" data-screen-label="{{ p.num }}" style="box-sizing:border-box;padding:20mm;font-family:Andika, Archivo, Verdana, sans-serif;font-size:14pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:5mm">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:4mm">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:16pt">Roule galette · {{ p.groupe }}</span>
<span style="font-size:11pt;color:#4a5568">inspiré de Narramus</span>
</div>
<div style="display:flex;align-items:center;gap:4mm"><img src="clean/pictos/ciseaux.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><span style="font-weight:700">Je découpe les cartes.</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1.5px dashed #12233b;border-left:1.5px dashed #12233b">
<sc-for list="{{ p.cartes }}" as="c" hint-placeholder-count="6">
<div style="border-right:1.5px dashed #12233b;border-bottom:1.5px dashed #12233b;height:66mm;box-sizing:border-box;padding:4mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2mm">
<img src="{{ c.src }}" alt="" style="width:44mm;height:44mm;object-fit:contain" />
<span style="font-size:18pt;font-weight:700;text-align:center;line-height:1.1">{{ c.mot }}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pret: !!window.RG_MOTS };
  componentDidMount() { if (!window.RG_MOTS) { const t = setInterval(() => { if (window.RG_MOTS) { clearInterval(t); this.setState({ pret: true }); } }, 100); } }
  renderVals() {
    const G = window.RG_MOTS || [];
    return {
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); },
      pages: G.map((g, i) => ({ num: String(i + 1).padStart(2, '0'), groupe: g.groupe,
        cartes: g.mots.map(([mot, img]) => ({ mot, src: 'clean/mot-' + img + '.webp' })) }))
    };
  }
}
</script>
</body>
</html>
