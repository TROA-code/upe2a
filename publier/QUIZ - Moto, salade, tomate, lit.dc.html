<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
<style>
body{margin:0;background:#1d4e89}
a{color:#fff}
a:hover{color:#f2c200}
</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;color:#14213d;display:flex;flex-direction:column;align-items:center;padding:14px 14px 30px;gap:14px">
<div style="width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;gap:10px">
<button class="bouton" onClick="{{ retour }}" style="border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;cursor:pointer">← L'accueil</button>
<span style="color:#fff;font-size:16px">{{ position }}</span>
</div>

<sc-if value="{{ accueil }}" hint-placeholder-val="{{ true }}">
<div style="width:100%;max-width:760px;box-sizing:border-box;background:#fff;border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:20px">
<span style="font-family:'Archivo Black',Verdana,sans-serif;font-size:32px;text-align:center">C'est quoi ?</span>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:520px">
<sc-for list="{{ vignettes }}" as="v" hint-placeholder-count="4"><div style="{{ v }}"></div></sc-for>
</div>
<button onClick="{{ commencer }}" style="border:none;border-radius:14px;background:#2a9d6e;color:#fff;font-family:'Archivo Black',Verdana,sans-serif;font-size:24px;padding:18px 40px;cursor:pointer">▶ Je commence</button>
</div>
</sc-if>

<sc-if value="{{ enJeu }}" hint-placeholder-val="{{ false }}">
<div style="width:100%;max-width:760px;box-sizing:border-box;background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px">
<div style="display:flex;align-items:center;gap:14px">
<span style="font-family:'Archivo Black',Verdana,sans-serif;font-size:28px;text-align:center">{{ q.question }}</span>
<button onClick="{{ ecouter }}" title="J'écoute" style="flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:2px solid #1d4e89;background:#fff;font-size:26px;cursor:pointer">🔊</button>
</div>
<sc-if value="{{ q.aImage }}" hint-placeholder-val="{{ false }}"><div style="{{ q.image }}"></div></sc-if>
<sc-if value="{{ q.aMot }}" hint-placeholder-val="{{ false }}">
<div style="font-size:72px;line-height:1.1;letter-spacing:0.02em;padding:10px 0"><span style="font-weight:700;color:#c0392b">{{ q.gras }}</span><span>{{ q.suite }}</span></div>
</sc-if>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%">
<sc-for list="{{ reponses }}" as="r" hint-placeholder-count="4">
<button onClick="{{ r.choisir }}" style="{{ r.style }}"><span>{{ r.texte }}</span><sc-if value="{{ r.aImage }}" hint-placeholder-val="{{ false }}"><span style="{{ r.image }}"></span></sc-if></button>
</sc-for>
</div>
<sc-if value="{{ bravo }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<span style="font-family:'Archivo Black',Verdana,sans-serif;font-size:48px;color:#2a9d6e">BRAVO !</span>
<button onClick="{{ suivant }}" style="border:none;border-radius:14px;background:#1d4e89;color:#fff;font-family:'Archivo Black',Verdana,sans-serif;font-size:22px;padding:16px 34px;cursor:pointer">{{ texteSuivant }}</button>
</div>
</sc-if>
<sc-if value="{{ zut }}" hint-placeholder-val="{{ false }}">
<span style="font-family:'Archivo Black',Verdana,sans-serif;font-size:48px;color:#c0392b">OH ZUT !</span>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ fin }}" hint-placeholder-val="{{ false }}">
<div style="width:100%;max-width:760px;box-sizing:border-box;background:#fff;border-radius:18px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:22px">
<span style="font-family:'Archivo Black',Verdana,sans-serif;font-size:44px;color:#2a9d6e;text-align:center">BRAVO !</span>
<span style="font-size:22px;text-align:center">J'ai fini.</span>
<button onClick="{{ recommencer }}" style="border:none;border-radius:14px;background:#2a9d6e;color:#fff;font-family:'Archivo Black',Verdana,sans-serif;font-size:22px;padding:16px 34px;cursor:pointer">↻ Je recommence</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* QUIZ A1.1 — moto, salade, tomate, lit (24/09). SES 8 questions, dans SON ordre, réponses
   dans SON ordre. Page élève : « Cette semaine » (jeudi 24) — on réfléchira ce week-end à
   un coin « Mes quiz ».
   Règles du projet : pas de score ni de compteur d'erreurs ; BRAVO ! / OH ZUT ! au coup ;
   on touche ; la voix lit la question. Sur une erreur, la case devient rouge et l'élève
   recherche — on ne montre pas la bonne réponse à sa place. */
const ph = m => "background:#fff url('clean/mot-" + m + ".webp') center/contain no-repeat";
const Q = [
  { img: 'moto', question: 'C’est quoi ?', dit: 'C’est quoi ?', rep: ['moto','salade','tomate','lit'], ok: 'moto' },
  { img: 'salade', question: 'C’est quoi ?', dit: 'C’est quoi ?', rep: ['lit','salade','moto','tomate'], ok: 'salade' },
  { img: 'tomate', question: 'C’est quoi ?', dit: 'C’est quoi ?', rep: ['tomate','moto','lit','salade'], ok: 'tomate' },
  { img: 'lit', question: 'C’est quoi ?', dit: 'C’est quoi ?', rep: ['salade','tomate','lit','moto'], ok: 'lit' },
  /* ⚠ Q5-Q6 testent la LECTURE : la voix ne dit JAMAIS le mot, seulement la consigne. */
  { mot: ['', 'salade'], question: 'Je lis. Je touche l’image.', dit: 'Je lis le mot. Je touche l’image.', repImg: true, rep: ['moto','salade','tomate','lit'], ok: 'salade' },
  { mot: ['', 'tomate'], question: 'Je lis. Je touche l’image.', dit: 'Je lis le mot. Je touche l’image.', repImg: true, rep: ['lit','moto','tomate','salade'], ok: 'tomate' },
  { mot: ['mo', 'to'], question: 'La première syllabe ?', dit: 'mo… to. La première syllabe ?', rep: ['mo','to','sa','li'], ok: 'mo' },
  { mot: ['to', 'mate'], question: 'La première syllabe ?', dit: 'to… ma… te. La première syllabe ?', rep: ['sa','to','mo','ma'], ok: 'to' }];

class Component extends DCLogic {
  state = { etape: -1, rouges: [], trouve: false, zut: false };
  dire(t) {
    try { if (!window.speechSynthesis) return; speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
  }
  son(bon) {
    try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      const c = this.ac || (this.ac = new A()); const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination); const t = c.currentTime;
      o.frequency.setValueAtTime(bon ? 660 : 440, t); o.frequency.linearRampToValueAtTime(bon ? 990 : 260, t + 0.25);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.start(t); o.stop(t + 0.36);
    } catch (e) {}
  }
  aller(i) { this.setState({ etape: i, rouges: [], trouve: false, zut: false }, () => { if (i >= 0 && i < Q.length) this.dire(Q[i].dit); }); }
  renderVals() {
    const { etape, rouges, trouve, zut } = this.state;
    const q = Q[etape] || Q[0];
    const base = 'min-height:84px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-family:inherit;font-size:30px;font-weight:700;color:#14213d;';
    return {
      retour: () => { if (history.length > 1) history.back(); else location.href = 'index.html' + location.search; },
      accueil: etape === -1, enJeu: etape >= 0 && etape < Q.length, fin: etape >= Q.length,
      position: etape >= 0 && etape < Q.length ? (etape + 1) + ' / ' + Q.length : '',
      vignettes: ['moto','salade','tomate','lit'].map(m => 'aspect-ratio:1;border-radius:10px;border:2px solid #e2e6ee;' + ph(m)),
      commencer: () => this.aller(0),
      recommencer: () => this.aller(0),
      ecouter: () => this.dire(q.dit),
      q: { question: q.question, aImage: !!q.img, image: 'width:100%;max-width:340px;aspect-ratio:1;border-radius:14px;border:2px solid #e2e6ee;' + (q.img ? ph(q.img) : ''),
           aMot: !!q.mot, gras: q.mot ? q.mot[0] : '', suite: q.mot ? q.mot[1] : '' },
      reponses: q.rep.map(r => {
        const rouge = rouges.includes(r), vert = trouve && r === q.ok;
        return { texte: q.repImg ? '' : r, aImage: !!q.repImg,
          image: 'width:100%;max-width:150px;aspect-ratio:1;display:block;' + ph(r),
          style: base + 'border:3px solid ' + (vert ? '#2a9d6e' : rouge ? '#c0392b' : '#1d4e89') + ';background:' + (vert ? '#e3f4ec' : rouge ? '#fbe3e0' : '#fff'),
          choisir: () => {
            if (trouve || rouge) return;
            if (r === q.ok) { this.son(true); this.setState({ trouve: true, zut: false }); this.dire('Bravo !'); }
            else { this.son(false); this.setState({ rouges: rouges.concat(r), zut: true }); }
          } };
      }),
      bravo: trouve, zut: zut && !trouve,
      texteSuivant: etape === Q.length - 1 ? 'J’ai fini →' : 'Suivant →',
      suivant: () => this.aller(etape + 1)
    };
  }
}
</script>
</body>
</html>
