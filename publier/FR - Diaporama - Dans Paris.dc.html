     PAR-DESSUS la scène (`position:fixed`), parce que deck-stage occupe tout l'écran, et
     il s'effacé à l'impression. Ne jamais le retirer. -->
<!-- ⚠ LA BARRE EST À DROITE, PAS À GAUCHE : à gauche elle se posait sur la colonne de
     vignettes (elle fait 298 px pour un rail de 188) et recouvrait la première diapositive,
     qui devenait inclicable. À droite elle ne rencontre jamais le rail. -->

<script type="text/x-dc" data-dc-script>
/* DIAPORAMA — DANS PARIS (22/09, sa demande) : les étiquettes du poème, une par vue, dans
   l'ordre du texte. Pour projeter au tableau pendant qu'on écoute et qu'on récite.

   ⚠ L'ORDRE EST CELUI DU POÈME et il ne se mélange pas : paris, rue, maison, escalier,
     chambre, table, tapis, cage, nid, œuf, oiseau. Le texte s'emboîte — c'est l'ordre qui
     fait comprendre, chaque chose est DANS la précédente.
   ⚠ LE POÈME LUI-MÊME N'EST PAS RECOPIÉ ICI : il est sous droits. Seuls les noms des onze
     images sont écrits, avec leur article. Ne jamais ajouter les vers.
   ⚠ TROIS PRÉFIXES, À NE PAS MÉLANGER :
       · `diapo-paris-` — SA SÉRIE CUMULATIVE du 22/09 (Gemini) : la MÊME chambre, où l'on
         ajoute une chose à chaque vue — la table, la nappe, la cage, le nid, l'œuf, puis
         l'oiseau. C'est ce qui fait comprendre que chaque chose est DANS la précédente.
         Ces sept-là ne servent QU'ICI.
         ⚠ La chambre EST CELLE DE LA SÉRIE, vide (22/09) : l'illustration isolée du PDF
           montrait une AUTRE chambre, et le diaporama en affichait donc deux différentes —
           l'emboîtement se cassait, on ne voyait plus que la table est dans CETTE chambre.
           Ne pas repasser `une chambre` sur `poeme-paris-chambre`.
       · `poeme-paris-` — les illustrations isolées (son PDF), pour les étiquettes à
         découper et « Écris les mots ». ⚠ NE PAS y mettre les scènes cumulatives : une
         étiquette doit montrer UN objet, pas une chambre entière.
       · `mot-` — ses photos réalistes (mot-maison, mot-table, mot-oiseau), rien à voir.
   Les quatre premières vues (paris, une rue, une maison, un escalier) sont encore dans
   l'ancien style : elle n'a pas tranché le 22/09 s'il faut les refaire dans ce décor.
   ⚠ LES DÉTERMINANTS SONT INDÉFINIS — une maison, un escalier, une chambre (sa correction
   du 22/09) : c'est ce que dit le texte, chaque chose est découverte, pas désignée. Ne pas
   les repasser en « la / le ».
   Le mot est écrit sous l'image : c'est ce qui sert à la lecture collective. S'il faut une
   version muette pour faire deviner, dupliquer le fichier plutôt que retirer les mots. */
/* ⚠ LES DEUX BOUTONS S'EFFACENT À L'IMPRESSION : `deck-stage` masque déjà son propre
   habillage, mais le nôtre est posé par-dessus, hors du composant. */
const CLE_VIGNETTES = 'upe2a-diapo-paris-vignettes';

class Component extends DCLogic {
  state = { vignettes: true };

  componentDidMount() {
    let v = true;
    try { v = localStorage.getItem(CLE_VIGNETTES) !== 'non'; } catch (e) {}
    this.setState({ vignettes: v });
    this.appliquer(v);

    /* ⚠ ON AVANCE AU CLIC SUR L'IMAGE (sa demande du 22/09) : les petites flèches de la
       barre du bas sont trop fines pour une classe, et au tableau on clique, on ne visse
       pas. On ignore les clics sur nos boutons, sur la colonne de vignettes et sur la barre
       du composant — sinon « Masquer les vignettes » ferait aussi avancer d'une vue.
       Le clic n'avance jamais au-delà de la dernière : on ne veut pas sortir par erreur. */
    this._clic = (e) => {
      const chemin = e.composedPath ? e.composedPath() : [];
      for (const n of chemin) {
        const c = n && n.classList;
        if (c && (c.contains('barre-diapo') || c.contains('rail') || c.contains('rail-resize') || c.contains('overlay'))) return;
      }
      const d = document.querySelector('deck-stage');
      if (!d || typeof d.goTo !== 'function') return;
      const vues = Array.prototype.slice.call(d.querySelectorAll('section'));
      let i = vues.findIndex(s => s.hasAttribute('data-deck-active'));
      if (i < 0) i = 0;
      if (i < vues.length - 1) d.goTo(i + 1);
    };
    document.addEventListener('click', this._clic);
  }

  componentWillUnmount() {
    if (this._clic) document.removeEventListener('click', this._clic);
  }

  /* La colonne de vignettes est l'outil de l'enseignante, pas de la classe : projetée, elle
     mange l'écran et montre la suite du poème avant l'heure (sa demande du 22/09).
     `no-rail` est un attribut observé de deck-stage : la scène se recadre toute seule. */
  appliquer(v) {
    const d = document.querySelector('deck-stage');
    if (!d) return;
    if (v) d.removeAttribute('no-rail'); else d.setAttribute('no-rail', '');
  }

  renderVals() {
    const v = this.state.vignettes;
    return {
      libelleVignettes: v ? 'Masquer les vignettes' : 'Voir les vignettes',
      basculeVignettes: () => {
        const n = !v;
        this.setState({ vignettes: n });
        try { localStorage.setItem(CLE_VIGNETTES, n ? 'oui' : 'non'); } catch (e) {}
        this.appliquer(n);
      },
      accueil: () => {
        if (typeof history !== 'undefined' && history.length > 1) history.back();
        else location.href = 'APPLI - Espace enseignant.dc.html' + location.search;
      }
    };
  }
}

</script>
