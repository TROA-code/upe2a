<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mon avenir au Havre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#F6F3EC;
  --panel:#FFFFFF;
  --ink:#1F2A33;
  --ink-soft:#4A5760;
  --navy:#0F3B52;
  --navy-deep:#0A2836;

  --erea:#E8622C;
  --lavoisier:#2E8B8B;
  --schuman:#C98F00;
  --lecesne:#8A4F82;
  --degrace:#3E8E5A;

  --radius-hublot: 50%;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Atkinson Hyperlegible', system-ui, sans-serif;

  --shadow-soft: 0 8px 24px rgba(15,59,82,0.14);
  --shadow-deep: 0 18px 44px rgba(10,40,54,0.28);
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--ink);
  overflow-x:hidden;
  -webkit-tap-highlight-color: transparent;
}

button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:4px solid var(--schuman); outline-offset:3px; }

/* subtle Perret-style grid texture, used sparingly as background texture */
.perret-grid{
  background-image:
    linear-gradient(rgba(15,59,82,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,59,82,0.05) 1px, transparent 1px);
  background-size: 42px 42px;
}

#app{ position:relative; width:100%; min-height:100vh; }

.page{
  display:none;
  min-height:100vh;
  width:100%;
}
.page.active{ display:block; animation: fadeIn .38s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* =========================================================
   HEADER commun
   ========================================================= */
.top-bar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 22px;
  background:var(--navy);
  color:#fff;
}
.top-bar h1{
  font-family:var(--font-display);
  font-size: clamp(1.15rem, 2.4vw, 1.6rem);
  margin:0;
  font-weight:700;
  letter-spacing:.3px;
}
.pill{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.14);
  border-radius:999px;
  padding:6px 14px 6px 8px;
  font-family:var(--font-display);
  font-weight:600;
  font-size:1rem;
}
.pill .dot{ width:14px; height:14px; border-radius:50%; display:inline-block; }

.back-btn{
  display:flex; align-items:center; gap:10px;
  background:#fff;
  color:var(--navy);
  border:none;
  border-radius:999px;
  padding:12px 22px 12px 16px;
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.05rem;
  box-shadow: var(--shadow-soft);
  min-height:56px;
}
.back-btn svg{ width:26px; height:26px; }
.back-btn:active{ transform:scale(.97); }

/* =========================================================
   PAGE 1 — CARTE
   ========================================================= */
#page-carte .stage{
  position:relative;
  width:100%;
  height: calc(100vh - 78px);
  min-height:520px;
  background:
    radial-gradient(ellipse at 15% 105%, #BFE0E0 0%, transparent 55%),
    linear-gradient(180deg, #EAF3F1 0%, var(--bg) 40%);
  overflow:hidden;
}
/* CARTE_DU_HAVRE : la vraie carte (capture fournie par l'enseignant),
   fichier "carte-havre.png" placé à côté de ce fichier HTML. Léger voile
   pour garder les hublots bien contrastés sans cacher les repères. */
#page-carte .stage{
  background-image:
    linear-gradient(180deg, rgba(246,243,236,0.12) 0%, rgba(246,243,236,0.22) 100%),
    url("carte-havre.png");
  background-size: cover;
  background-position: center;
}
/* sea */
.sea{
  position:absolute; left:0; right:0; bottom:0; height:26%;
  background: linear-gradient(180deg, #6FAAB8 0%, #4A8998 60%, #3A7684 100%);
}
.sea::before{
  content:""; position:absolute; inset:0;
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 2px, transparent 2px 34px);
  opacity:.6;
}
.crane{
  position:absolute; bottom:26%; width:6px; background:var(--navy-deep); opacity:.35;
}
.crane::before{
  content:""; position:absolute; top:0; left:-46px; width:100px; height:6px; background:var(--navy-deep);
}
.city-grid{
  position:absolute; left:0; right:0; top:6%; bottom:24%;
  opacity:.5;
}
.city-grid .row{
  position:absolute; left:2%; right:2%; height:5px; background:rgba(15,59,82,0.08);
}

.marker{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center;
  gap:8px;
  width: min(23vw, 190px);
}
.marker .hublot{
  width: min(20vw, 128px);
  height: min(20vw, 128px);
  border-radius:50%;
  background:var(--panel);
  border:6px solid var(--marker-color, var(--navy));
  box-shadow: var(--shadow-soft);
  display:flex; align-items:center; justify-content:center;
  position:relative;
  transition: transform .18s ease;
}
.marker:active .hublot{ transform:scale(.94); }
.marker .cluster-btn{
  position:absolute; inset:0; border-radius:50%;
  background:transparent; border:none; padding:0;
}
.marker .cluster-icons{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:4px;
  width:76%; height:76%;
  align-items:center; justify-items:center;
}
.marker .cluster-icons svg{ width:64%; height:64%; color:var(--marker-color, var(--navy)); }

.marker .name-btn{
  background:var(--marker-color, var(--navy));
  color:#fff;
  border:none;
  border-radius:14px;
  padding:8px 14px;
  font-family:var(--font-display);
  font-weight:700;
  font-size: clamp(.72rem, 1.5vw, .95rem);
  text-align:center;
  line-height:1.15;
  box-shadow: var(--shadow-soft);
  min-height:44px;
}
.marker .name-btn:active{ transform:scale(.96); }

.legend{
  position:absolute; left:16px; bottom:16px;
  background:rgba(255,255,255,.92);
  border-radius:16px;
  padding:12px 16px;
  font-family:var(--font-display);
  font-weight:600;
  color:var(--ink-soft);
  font-size:.85rem;
  box-shadow: var(--shadow-soft);
  max-width:220px;
}

/* =========================================================
   PAGE 2 — GRILLE METIERS
   ========================================================= */
#page-metiers .metiers-wrap{
  padding: 28px clamp(16px,4vw,48px) 60px;
}
.metiers-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:22px;
  margin-top:24px;
}
.metier-card{
  background:var(--panel);
  border-radius:26px;
  border:5px solid var(--card-color, var(--navy));
  padding:20px 16px 18px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  box-shadow: var(--shadow-soft);
  min-height:220px;
}
.metier-card .icon-btn{
  width:104px; height:104px;
  border-radius:50%;
  background: color-mix(in srgb, var(--card-color, var(--navy)) 14%, white);
  border:none;
  display:flex; align-items:center; justify-content:center;
  min-height:88px; min-width:88px;
}
.metier-card .icon-btn svg{ width:58px; height:58px; color:var(--card-color, var(--navy)); }
.metier-card .icon-btn:active{ transform:scale(.94); }

.metier-card .label-row{
  display:flex; align-items:center; gap:10px;
  width:100%;
  justify-content:center;
}
.metier-card .metier-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.05rem;
  color:var(--ink);
  text-align:center;
  line-height:1.2;
}
.speaker-btn{
  flex:0 0 auto;
  width:46px; height:46px;
  border-radius:50%;
  border:none;
  background: var(--card-color, var(--navy));
  color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.speaker-btn svg{ width:24px; height:24px; }
.speaker-btn.speaking{ animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }

.section-title{
  font-family:var(--font-display);
  font-size: clamp(1.3rem, 3vw, 1.9rem);
  font-weight:800;
  color:var(--navy);
  margin:0;
}
.section-sub{
  font-family:var(--font-body);
  color:var(--ink-soft);
  margin:4px 0 0;
  font-size:1.05rem;
}

/* =========================================================
   PAGE 3 — FICHE METIER
   ========================================================= */
#page-fiche .fiche-wrap{
  padding: 26px clamp(16px,4vw,48px) 70px;
  max-width:1000px;
  margin:0 auto;
}
.fiche-head{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  margin-bottom:22px;
}
.fiche-icon{
  width:84px; height:84px; border-radius:50%;
  background: color-mix(in srgb, var(--card-color, var(--navy)) 16%, white);
  display:flex; align-items:center; justify-content:center;
  border:4px solid var(--card-color, var(--navy));
  flex:0 0 auto;
}
.fiche-icon svg{ width:46px; height:46px; color:var(--card-color, var(--navy)); }
.fiche-title{
  font-family:var(--font-display);
  font-size: clamp(1.3rem,3vw,2rem);
  font-weight:800;
  color:var(--ink);
}
.fiche-title .lycee-tag{
  display:block;
  font-family:var(--font-body);
  font-weight:400;
  color:var(--ink-soft);
  font-size:1rem;
  margin-top:2px;
}

.media-row{
  display:grid; grid-template-columns:1.3fr 1fr; gap:20px;
  margin-bottom:26px;
}
@media (max-width:680px){ .media-row{ grid-template-columns:1fr; } }

.video-box, .photo-box{
  background:var(--navy-deep);
  border-radius:24px;
  overflow:hidden;
  position:relative;
  aspect-ratio: 4/3;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-soft);
}
.photo-box{ background: color-mix(in srgb, var(--card-color, var(--navy)) 20%, white); }
.video-box .play-btn{
  width:78px; height:78px; border-radius:50%;
  background:rgba(255,255,255,.92);
  border:none;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.video-box .play-btn svg{ width:34px; height:34px; color:var(--navy); margin-left:4px; }
.video-box .caption, .photo-box .caption{
  position:absolute; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.45);
  color:#fff; font-family:var(--font-body); font-size:.82rem;
  padding:8px 12px;
}
.photo-box svg{ width:56%; height:56%; color:var(--card-color, var(--navy)); opacity:.85; }

.tabs{
  display:flex; gap:10px; margin-bottom:0;
  flex-wrap:wrap;
}
.tab-btn{
  flex:1 1 140px;
  border:none;
  border-radius:20px 20px 0 0;
  padding:16px 10px 14px;
  background:#EFEAE0;
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.35rem;
  color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  min-height:76px;
}
.tab-btn .tab-label{ font-size:.78rem; }
.tab-btn.active{
  background:var(--panel);
  color:var(--card-color, var(--navy));
  box-shadow: 0 -4px 14px rgba(15,59,82,0.08);
}
.tab-panel{
  background:var(--panel);
  border-radius:0 20px 20px 20px;
  padding:26px 22px;
  min-height:150px;
  box-shadow: var(--shadow-soft);
  display:none;
  font-size:1.15rem;
  line-height:1.55;
}
.tab-panel.active{ display:flex; flex-direction:column; gap:16px; }
.tab-panel .row{
  display:flex; align-items:center; gap:14px;
}
.tab-panel .row svg{ width:38px; height:38px; color:var(--card-color, var(--navy)); flex:0 0 auto; }
.tab-panel .placeholder-note{
  font-size:.85rem; color:var(--ink-soft); font-style:italic; margin-top:10px;
}

.floating-back{
  position:fixed; right:18px; bottom:18px;
  z-index:20;
}

/* =========================================================
   MODAL IDENTITE
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,40,54,.55);
  display:flex; align-items:center; justify-content:center;
  padding:18px;
  z-index:40;
}
.modal-overlay.hidden{ display:none; }
.modal-card{
  background:var(--panel);
  border-radius:28px;
  max-width:640px; width:100%;
  padding:26px;
  box-shadow: var(--shadow-deep);
  position:relative;
  border-top:10px solid var(--card-color, var(--navy));
}
.modal-close{
  position:absolute; top:16px; right:16px;
  width:46px; height:46px; border-radius:50%;
  border:none; background:#EFEAE0; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
}
.modal-close svg{ width:22px; height:22px; }
.modal-body{
  display:grid; grid-template-columns:1fr 1.2fr; gap:20px;
  margin-top:8px;
}
@media (max-width:520px){ .modal-body{ grid-template-columns:1fr; } }
.modal-photo{
  background: color-mix(in srgb, var(--card-color, var(--navy)) 18%, white);
  border-radius:20px;
  aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
.modal-photo svg{ width:60%; height:60%; color:var(--card-color, var(--navy)); }
.modal-title{
  font-family:var(--font-display); font-weight:800; font-size:1.4rem;
  color:var(--ink); margin:0 0 12px;
}
.modal-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.modal-list li{ display:flex; align-items:center; gap:10px; font-size:1rem; }
.modal-list svg{ width:28px; height:28px; color:var(--card-color, var(--navy)); flex:0 0 auto; }
.modal-cta{
  margin-top:18px;
  width:100%;
  background:var(--card-color, var(--navy));
  color:#fff; border:none; border-radius:16px;
  padding:16px; font-family:var(--font-display); font-weight:700; font-size:1.1rem;
  min-height:56px;
}
</style>
</head>

<script>

    x:55, y:84, color:'var(--lecesne)',

    x:62, y:82, color:'var(--degrace)',
    metiers:[
      {id:'restauration', nom:'PRODUCTION EN\nRESTAURATION', icon:'ic-plate', fait:"Je prépare des repas simples en restauration collective.", diplome:'CAP', trajet:'bus'},
      {id:'grand-age', nom:'ACCOMPAGNANT\nGRAND ÂGE', icon:'ic-heart-hands', fait:"J'aide les personnes âgées dans les gestes du quotidien.", diplome:'CAP', trajet:'bus'},
      {id:'commerce', nom:'ÉQUIPIER DE\nCOMMERCE', icon:'ic-cart', fait:"Je range les rayons et j'aide les clients dans un magasin.", diplome:'CAP', trajet:'bus'},
    ]

];

const TRAJET_ICON = { bus:'ic-bus', tram:'ic-bus', velo:'ic-bike', pied:'ic-walk' };
const TRAJET_LABEL = { bus:'En bus', tram:'En tramway', velo:'À vélo', pied:'À pied' };

let currentLyceeId = null;
let currentMetierId = null;

/* =========================================================================
   RENDU — PAGE 1 : CARTE
   ========================================================================= */
function renderCarte(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="legend">💡 Touche le <strong>nom</strong> pour voir le lycée. Touche les <strong>images</strong> pour voir les métiers.</div>
  `;
  LYCEES.forEach(lycee=>{
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = lycee.x + '%';
    marker.style.top = lycee.y + '%';
    marker.style.setProperty('--marker-color', lycee.color);
    marker.innerHTML = `
      <div class="hublot">
        <button class="cluster-btn" aria-label="Voir les métiers de ${lycee.nom}" data-lycee="${lycee.id}"></button>
        <div class="cluster-icons">
          ${lycee.metiers.slice(0,5).map(m=>`<svg><use href="#${m.icon}"/></svg>`).join('')}
        </div>
      </div>
      <button class="name-btn" data-lycee-name="${lycee.id}">${lycee.nom}</button>
    `;
    stage.appendChild(marker);
  });

  stage.querySelectorAll('.cluster-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> goToMetiers(btn.dataset.lycee));
  });
  stage.querySelectorAll('.name-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openIdentite(btn.dataset.lyceeName));
  });
}

/* =========================================================================
   MODAL IDENTITE
   ========================================================================= */
function openIdentite(lyceeId){
  const lycee = LYCEES.find(l=>l.id===lyceeId);
  if(!lycee) return;
  document.getElementById('modal-title').textContent = lycee.nom;
  document.getElementById('modal-card').style.setProperty('--card-color', lycee.color);
  document.getElementById('modal-list').innerHTML = lycee.metiers.map(m=>`
    <li><svg><use href="#${m.icon}"/></svg>${m.nom.replace('\n',' ')}</li>
  `).join('');
  document.getElementById('modal-cta').onclick = ()=>{ closeIdentite(); goToMetiers(lyceeId); };
  document.getElementById('modal-identite').classList.remove('hidden');
}
function closeIdentite(){
  document.getElementById('modal-identite').classList.add('hidden');
}
document.getElementById('modal-close').addEventListener('click', closeIdentite);
document.getElementById('modal-identite').addEventListener('click', (e)=>{
  if(e.target.id==='modal-identite') closeIdentite();
});

/* =========================================================================
   RENDU — PAGE 2 : GRILLE METIERS
   ========================================================================= */
function goToMetiers(lyceeId){
  currentLyceeId = lyceeId;
  const lycee = LYCEES.find(l=>l.id===lyceeId);
  document.getElementById('metiers-title').textContent = lycee.nom;
  document.getElementById('metiers-lycee-name').textContent = lycee.nom;
  document.getElementById('metiers-pill').querySelector('.dot').style.background = lycee.color.replace('var(','').replace(')','') === lycee.color ? lycee.color : lycee.color;
  document.getElementById('metiers-pill').style.setProperty('--dot-color', lycee.color);
  document.getElementById('metiers-pill').querySelector('.dot').style.background = getComputedColor(lycee.color);

  const grid = document.getElementById('metiers-grid');
  grid.innerHTML = lycee.metiers.map(m=>`
    <div class="metier-card" style="--card-color:${lycee.color}">
      <button class="icon-btn" data-metier="${m.id}" aria-label="Voir la fiche ${m.nom}">
        <svg><use href="#${m.icon}"/></svg>
      </button>
      <div class="label-row">
        <span class="metier-name">${m.nom}</span>
        <button class="speaker-btn" data-say="${m.nom.replace('\n',' ')}" aria-label="Écouter le nom du métier">
          <svg><use href="#ic-speaker"/></svg>
        </button>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.icon-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> goToFiche(lyceeId, btn.dataset.metier));
  });
  grid.querySelectorAll('.speaker-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> speak(btn.dataset.say, btn));
  });

  showPage('page-metiers');
}

function getComputedColor(varColor){
  const tmp = document.createElement('div');
  tmp.style.color = varColor;
  document.body.appendChild(tmp);
  const c = getComputedStyle(tmp).color;
  document.body.removeChild(tmp);
  return c;
}

/* =========================================================================
   RENDU — PAGE 3 : FICHE METIER
   ========================================================================= */
function goToFiche(lyceeId, metierId){
  currentLyceeId = lyceeId;
  currentMetierId = metierId;
  const lycee = LYCEES.find(l=>l.id===lyceeId);
  const metier = lycee.metiers.find(m=>m.id===metierId);

  document.getElementById('fiche-lycee-name').textContent = lycee.nom;
  document.querySelector('#fiche-pill .dot').style.background = getComputedColor(lycee.color);
  document.getElementById('fiche-icon').style.setProperty('--card-color', lycee.color);
  document.getElementById('fiche-icon-use').setAttribute('href', '#'+metier.icon);
  document.getElementById('fiche-title').childNodes[0].textContent = metier.nom.replace('\n',' ');
  document.getElementById('fiche-lycee-tag').textContent = lycee.nom;

  document.querySelectorAll('.video-box, .photo-box').forEach(el=> el.style.setProperty('--card-color', lycee.color));
  document.querySelectorAll('.tab-panel').forEach(el=> el.style.setProperty('--card-color', lycee.color));

  document.getElementById('panel-fait').innerHTML = `
    <div class="row"><svg><use href="#ic-gear"/></svg><span>${metier.fait}</span></div>
    <div class="placeholder-note">✏️ À compléter : ajouter 2-3 photos du geste professionnel.</div>
  `;

  const trajetIcon = TRAJET_ICON[metier.trajet] || 'ic-bus';
  const trajetLabel = TRAJET_LABEL[metier.trajet] || 'En transport';
  document.getElementById('panel-trajet').innerHTML = `
    <div class="row"><svg><use href="#${trajetIcon}"/></svg><span>${trajetLabel} pour aller à ${lycee.nom}.</span></div>
    <div class="placeholder-note">✏️ À compléter : ligne de bus/tram précise, temps de trajet, plan d'accès.</div>
  `;

  document.getElementById('panel-diplome').innerHTML = `
    <div class="row"><svg><use href="#ic-cap"/></svg><span>${metier.diplome} — diplôme préparé en 2 ans après la 3e ou l'UPE2A.</span></div>
    <div class="placeholder-note">✏️ À compléter : durée exacte, stages, poursuite d'études possible.</div>
  `;

  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab==='fait');
    b.setAttribute('aria-selected', b.dataset.tab==='fait');
  });
  document.querySelectorAll('.tab-panel').forEach(p=>{
    p.classList.toggle('active', p.dataset.panel==='fait');
  });

  document.getElementById('btn-play-video').onclick = ()=>{
    alert('🎬 Emplacement prêt pour la vidéo du geste professionnel.\n(Ajoute un fichier .mp4 dans le code — voir commentaire VIDEO_SOURCE).');
  };
  // VIDEO_SOURCE : pour ajouter une vraie vidéo, remplacer le bouton play
  // par une balise <video controls src="videos/nom-du-metier.mp4"></video>

  showPage('page-fiche');
}

/* Onglets de la fiche métier */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.toggle('active', b===btn);
      b.setAttribute('aria-selected', b===btn);
    });
    document.querySelectorAll('.tab-panel').forEach(p=>{
      p.classList.toggle('active', p.dataset.panel===btn.dataset.tab);
    });
  });
});

/* =========================================================================
   SYNTHESE VOCALE (bouton haut-parleur)
   Utilise la voix du navigateur (Web Speech API) — fonctionne sans fichier
   audio. Pour brancher de vrais fichiers son enregistrés par l'enseignant,
   remplacer le contenu de la fonction speak() par la lecture d'un <audio>.
   ========================================================================= */
function speak(text, btn){
  if(!('speechSynthesis' in window)){
    alert('🔊 ' + text);
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  utter.rate = 0.85;
  btn.classList.add('speaking');
  utter.onend = ()=> btn.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

/* =========================================================================
   NAVIGATION ENTRE PAGES
   ========================================================================= */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=> p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('btn-back-carte-1').addEventListener('click', ()=> showPage('page-carte'));
document.getElementById('btn-back-metiers').addEventListener('click', ()=> goToMetiers(currentLyceeId));

/* =========================================================================
   INIT
   ========================================================================= */
renderCarte();
</script>
