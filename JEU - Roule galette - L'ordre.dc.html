<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;background:#f4f1ea;font-family:Archivo, Verdana, sans-serif;color:#12233b}a{color:#1d4e89}a:hover{color:#12233b}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:#12233b">
<button class="bouton" onClick="{{ retour }}" style="min-height:44px;border:none;border-radius:10px;background:#fff;color:#12233b;padding:0 14px;font-weight:700;font-size:16px;cursor:pointer">{{ libelleRetour }}</button>
<span style="flex:1;font-family:Archivo Black, Archivo, sans-serif;font-size:20px;color:#fff">Roule galette — l’ordre de l’histoire</span>
</div>

<sc-if value="{{ choix }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:28px;text-align:center">Je remets les images dans l’ordre.</span>
<div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center">
<sc-for list="{{ jeux }}" as="j" hint-placeholder-count="2">
<button class="bouton" onClick="{{ j.ouvrir }}" style="width:280px;display:flex;flex-direction:column;gap:12px;align-items:center;padding:18px;border:3px solid #c1440e;border-radius:18px;background:#fff;cursor:pointer">
<span style="width:100%;aspect-ratio:16 / 10;background-image:{{ j.img }};background-size:contain;background-position:center;background-repeat:no-repeat;display:block"></span>
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:24px;color:#c1440e">{{ j.titre }}</span>
<span style="font-size:16px;color:#12233b">{{ j.nb }}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ enJeu }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 16px 120px">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:22px;text-align:center">Je touche une image, puis je touche sa case.</span>
<div style="width:100%;max-width:1200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
<sc-for list="{{ cases }}" as="c" hint-placeholder-count="5">
<div onClick="{{ c.toucher }}" onDragOver="{{ c.survol }}" onDrop="{{ c.lacher }}" style="display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:26px;color:#12233b">{{ c.n }}</span>
<span style="position:relative;width:100%;aspect-ratio:16 / 10;box-sizing:border-box;border:4px {{ c.trait }} {{ c.bord }};border-radius:12px;background-color:#fff;background-image:{{ c.img }};background-size:contain;background-position:center;background-repeat:no-repeat;display:block">
<sc-if value="{{ c.aLettre }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;background:#12233b;color:#fff;font-family:Archivo Black, Archivo, sans-serif;font-size:24px;line-height:40px;text-align:center;display:block">{{ c.lettre }}</span></sc-if>
</span>
</div>
</sc-for>
</div>
<div style="width:100%;max-width:1200px;border-top:2px solid #d9d3c4;padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:120px">
<sc-for list="{{ reserve }}" as="r" hint-placeholder-count="5">
<button class="bouton" draggable="true" onDragStart="{{ r.prendre }}" onClick="{{ r.toucher }}" style="width:180px;aspect-ratio:16 / 10;border:4px solid {{ r.bord }};border-radius:12px;background-color:#fff;background-image:{{ r.img }};background-size:contain;background-position:center;background-repeat:no-repeat;cursor:grab;padding:0;box-shadow:0 3px 10px rgba(0,0,0,0.15);position:relative"><span style="position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;background:#12233b;color:#fff;font-family:Archivo Black, Archivo, sans-serif;font-size:24px;line-height:40px;text-align:center;display:block;pointer-events:none">{{ r.lettre }}</span></button>
</sc-for>
</div>
</div>
<div style="position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:12px 16px;background:#fff;box-shadow:0 -4px 14px rgba(0,0,0,0.12)">
<sc-if value="{{ aMessage }}" hint-placeholder-val="{{ false }}">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:40px;color:{{ couleurMessage }}">{{ message }}</span>
</sc-if>
<sc-if value="{{ peutFinir }}" hint-placeholder-val="{{ false }}">
<button class="bouton" onClick="{{ finir }}" style="min-height:60px;border:none;border-radius:14px;background:#2a9d6e;color:#fff;padding:0 28px;font-family:Archivo Black, Archivo, sans-serif;font-size:22px;cursor:pointer">J’ai fini</button>
</sc-if>
<sc-if value="{{ gagne }}" hint-placeholder-val="{{ false }}">
<button class="bouton" onClick="{{ encore }}" style="min-height:60px;border:3px solid #12233b;border-radius:14px;background:#fff;color:#12233b;padding:0 22px;font-weight:700;font-size:19px;cursor:pointer">↻ Encore</button>
<button class="bouton" onClick="{{ autre }}" style="min-height:60px;border:none;border-radius:14px;background:#c1440e;color:#fff;padding:0 22px;font-family:Archivo Black, Archivo, sans-serif;font-size:19px;cursor:pointer">{{ libelleAutre }}</button>
</sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* 06/10 (son oui : « les deux, 5 et 6, deux jeux ») : remettre les pages de l'album dans l'ordre.
   Jeu 1 = le début (vues 1-5 du diaporama), jeu 2 = la route (vues 5-10). Toucher-puis-toucher + glissé.
   « J'ai fini » valide (BRAVO ! / OH ZUT !), rien n'est compté ; les cases fausses passent en rouge, on corrige. */
const IMG = n => "url('clean/diapo-galette-" + n + ".webp')";
const JEUX = { 1: [1, 2, 3, 4, 5], 2: [5, 6, 7, 8, 9, 10] };
const melange = a => { let r; do { r = a.slice().sort(() => Math.random() - 0.5); } while (r.every((x, i) => x === a[i])); return r; };
class Component extends DCLogic {
  state = { jeu: null, reserve: [], cases: [], sel: null, fini: false, ok: false };
  /* Lettres A-E (jeu 1) puis F-K (jeu 2) posées sur les images mélangées : on révise l'alphabet l'air de rien (sa demande). */
  ouvrir(j) { const r = melange(JEUX[j]), base = j === 1 ? 0 : 5, lettres = {};
    r.forEach((id, i) => { lettres[id] = 'ABCDEFGHIJK'[base + i]; });
    this.setState({ jeu: j, lettres, reserve: r, cases: JEUX[j].map(() => null), sel: null, fini: false, ok: false }); }
  poser(i, id) {
    this.setState(s => { const cases = s.cases.slice(), reserve = s.reserve.filter(x => x !== id);
      if (cases[i] != null) reserve.push(cases[i]); cases[i] = id; return { cases, reserve, sel: null, fini: false }; });
  }
  toucherCase(i) {
    const s = this.state; if (s.ok) return;
    if (s.sel != null) return this.poser(i, s.sel);
    if (s.cases[i] != null) this.setState(p => { const cases = p.cases.slice(); const id = cases[i]; cases[i] = null; return { cases, reserve: p.reserve.concat(id), fini: false }; });
  }
  renderVals() {
    const s = this.state, J = JEUX[s.jeu] || [];
    const plein = s.cases.length && s.cases.every(x => x != null);
    return {
      libelleRetour: s.jeu ? '← Les deux jeux' : '← L’accueil',
      retour: () => { if (s.jeu) return this.setState({ jeu: null });
        if (history.length > 1) history.back(); else location.href = 'APPLI - Espace enseignant.dc.html' + (location.search || ''); },
      choix: !s.jeu, enJeu: !!s.jeu,
      jeux: [1, 2].map(j => ({ titre: 'Jeu ' + j, nb: JEUX[j].length + ' images', img: IMG(JEUX[j][0]), ouvrir: () => this.ouvrir(j) })),
      cases: s.cases.map((id, i) => { const juste = s.fini && id === J[i], faux = s.fini && id !== J[i];
        return { n: i + 1, aLettre: !!id, lettre: id ? (s.lettres || {})[id] : '', img: id ? IMG(id) : 'none', trait: id ? 'solid' : 'dashed', bord: juste ? '#1f8a4c' : faux ? '#d0453a' : id ? '#12233b' : '#9aa3b2',
          toucher: () => this.toucherCase(i), survol: e => e.preventDefault(),
          lacher: e => { e.preventDefault(); const id2 = +e.dataTransfer.getData('text/plain'); if (id2 && !s.ok) this.poser(i, id2); } }; }),
      reserve: s.reserve.map(id => ({ lettre: (s.lettres || {})[id], img: IMG(id), bord: s.sel === id ? '#c1440e' : '#fff',
        toucher: () => this.setState({ sel: s.sel === id ? null : id }),
        prendre: e => e.dataTransfer.setData('text/plain', String(id)) })),
      peutFinir: plein && !s.ok,
      finir: () => { const ok = s.cases.every((x, i) => x === J[i]); this.setState({ fini: true, ok }); },
      aMessage: s.fini, message: s.ok ? 'BRAVO !' : 'OH ZUT !', couleurMessage: s.ok ? '#1f8a4c' : '#d0453a',
      gagne: s.ok, encore: () => this.ouvrir(s.jeu), autre: () => this.ouvrir(s.jeu === 1 ? 2 : 1),
      libelleAutre: s.jeu === 1 ? 'Jeu 2 →' : '← Jeu 1'
    };
  }
}
</script>
</body>
</html>
