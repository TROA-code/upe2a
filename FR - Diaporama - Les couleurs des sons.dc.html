</section>

<section data-label="ROUGE" data-screen-label="ROUGE" data-speaker-notes="rouge — on entend ou." style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;background:#d62828;color:#ffffff;font-family:Helvetica, Arial, sans-serif"><span style="font-size:300px;font-weight:700;line-height:1">ROUGE</span><span style="font-family:'BA Script';font-size:110px;line-height:1">ou</span></section>

</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Diaporama des couleurs des sons (06/10) : SON code (violet è, vert sapin in). Retour + vignettes en
   haut à DROITE ; avance au clic ; jamais au-delà de la dernière vue (règles du 22/09). */
const CLE_VIGNETTES = 'upe2a-diapo-couleurs-vignettes';
class Component extends DCLogic {
  state = { vignettes: true };
  componentDidMount() {
    let v = true;
    try { v = localStorage.getItem(CLE_VIGNETTES) !== 'non'; } catch (e) {}
    this.setState({ vignettes: v });
    this.appliquer(v);
    this._clic = (e) => {
      const chemin = e.composedPath ? e.composedPath() : [];
      for (const n of chemin) {
        const c = n && n.classList;
        if (c && (c.contains('barre-diapo') || c.contains('rail') || c.contains('rail-resize') || c.contains('overlay'))) return;
      }
      const d = document.querySelector('deck-stage');
      if (!d || typeof d.goTo !== 'function') return;
      const vues = Array.prototype.slice.call(d.querySelectorAll('section'));
      let i = vues.findIndex(s => s.hasAttribute('data-deck-active'));
      if (i < 0) i = 0;
      if (i < vues.length - 1) d.goTo(i + 1);
    };
    document.addEventListener('click', this._clic);
  }
  componentWillUnmount() { if (this._clic) document.removeEventListener('click', this._clic); }
  appliquer(v) {
    const d = document.querySelector('deck-stage');
    if (!d) return;
    if (v) d.removeAttribute('no-rail'); else d.setAttribute('no-rail', '');
  }
  renderVals() {
    const v = this.state.vignettes;
    return {
      libelleVignettes: v ? 'Masquer les vignettes' : 'Voir les vignettes',
      basculeVignettes: () => {
        const n = !v;
        this.setState({ vignettes: n });
        try { localStorage.setItem(CLE_VIGNETTES, n ? 'oui' : 'non'); } catch (e) {}
        this.appliquer(n);
      },
      accueil: () => {
        const ici = location.href;
        try { history.back(); } catch (e) {}
        setTimeout(() => { if (location.href === ici) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400);
      }
    };
  }
}
</script>
</body>
</html>
