<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;font-family:Andika, Archivo, Verdana, sans-serif;color:#12233b}a{color:#1d4e89}a:hover{color:#12233b}@media print{.bouton{display:none !important}}</style>
</helmet>
<button class="bouton" onClick="{{ retour }}" style="position:fixed;top:12px;left:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;font-family:Arial, Helvetica, sans-serif;cursor:pointer">← L'accueil</button>
<button class="bouton" onClick="{{ imprimer }}" style="position:fixed;top:12px;right:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#2a9d6e;color:#fff;padding:0 18px;font-weight:700;font-size:15px;font-family:Arial, Helvetica, sans-serif;cursor:pointer">🖨 Imprimer</button>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" hint-size="100%,100%">
<section class="page" data-screen-label="01" style="box-sizing:border-box;padding:20mm;font-family:Andika, Archivo, Verdana, sans-serif;font-size:14pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:5mm">
<div style="flex:0 0 auto;background:#12233b;color:#fff;padding:3mm 6mm;display:flex;align-items:baseline;justify-content:space-between;gap:6mm">
<span style="font-size:20pt;font-weight:700;letter-spacing:0.04em">LA FICHE D'IDENTITÉ</span>
<span style="font-size:13pt;white-space:nowrap">Préparation au DELF</span>
</div>
<div style="flex:0 0 auto;display:flex;align-items:center;gap:4mm"><img src="clean/pictos/lis.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><img src="clean/pictos/ecris.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><span style="font-size:14pt;font-weight:700">Activité 1 — Je lis le texte. J'écris la fiche.</span></div>
<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:3mm">
<sc-for list="{{ personnes }}" as="p" hint-placeholder-count="3">
<div style="display:grid;grid-template-columns:64mm 1fr;gap:5mm;align-items:center">
<span style="font-size:13pt;line-height:1.4;text-wrap:pretty">{{ p.texte }}</span>
<div style="border:1.5px solid #12233b;border-radius:3mm;padding:2mm 4mm;display:flex;flex-direction:column;gap:0.6mm">
<sc-for list="{{ champs }}" as="c" hint-placeholder-count="6"><div style="display:flex;align-items:flex-end;gap:2mm;font-size:12pt;height:6.2mm"><span style="font-weight:700;white-space:nowrap">{{ c }} :</span><span style="flex:1;border-bottom:1px solid #7a8494;height:5mm"></span></div></sc-for>
</div>
</div>
</sc-for>
</div>
<div style="flex:0 0 auto;display:flex;align-items:center;gap:4mm;margin-top:2mm"><img src="clean/pictos/ecris.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><span style="font-size:14pt;font-weight:700">Activité 2 — Et toi ? J'écris ma fiche. Je me présente.</span></div>
<div style="flex:0 0 auto;border:2px solid #12233b;border-radius:4mm;padding:2mm 6mm 4mm;display:flex;flex-direction:column;gap:0.5mm">
<sc-for list="{{ champs }}" as="c" hint-placeholder-count="6"><div style="display:flex;align-items:flex-end;gap:2mm;height:9mm"><span style="font-size:14pt;font-weight:700;white-space:nowrap">{{ c }} :</span><span style="flex:1;border-bottom:1.5px solid #7a8494;height:8mm"></span></div></sc-for>
</div>
</section>
<section class="page" data-screen-label="02 Corrigé" style="box-sizing:border-box;padding:20mm;font-family:Andika, Archivo, Verdana, sans-serif;font-size:14pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:5mm">
<div style="flex:0 0 auto;background:#12233b;color:#fff;padding:3mm 6mm;display:flex;align-items:baseline;justify-content:space-between;gap:6mm">
<span style="font-size:20pt;font-weight:700;letter-spacing:0.04em">CORRIGÉ</span>
<span style="font-size:13pt;white-space:nowrap">Préparation au DELF · Activité 1</span>
</div>
<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:6mm">
<sc-for list="{{ personnes }}" as="p" hint-placeholder-count="3">
<div style="border:1.5px solid #12233b;border-radius:3mm;padding:3mm 5mm;display:flex;flex-direction:column;gap:1.5mm">
<sc-for list="{{ p.rep }}" as="r" hint-placeholder-count="6"><div style="display:grid;grid-template-columns:42mm 1fr;font-size:13pt;line-height:1.35"><span style="font-weight:700">{{ r.c }} :</span><span>{{ r.v }}</span></div></sc-for>
</div>
</sc-for>
<span style="font-size:12pt;color:#4a5568">Activité 2 : la réponse de chaque élève.</span>
</div>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Remplir une fiche d'identité (09/10, sa demande) : mise en page de l'exercice 3-4 de son manuel
   (photo). Textes copiés tels quels. Cases photo laissées vides (photos du manuel non reprises).
   Consignes en « je » + pictos. Corrigé page 3. */
const CHAMPS = ['Nom', 'Prénom', 'Nationalité', 'Profession', 'Adresse (ville)', 'État civil'];
class Component extends DCLogic {
  renderVals() {
    const p = (texte, vals) => ({ texte, rep: CHAMPS.map((c, i) => ({ c, v: vals[i] })) });
    return {
      champs: CHAMPS,
      personnes: [
        p('Zita Koba est sénégalaise. Elle est célibataire. Elle est vendeuse dans un supermarché et elle habite en banlieue à Poissy.',
          ['Koba', 'Zita', 'sénégalaise', 'vendeuse', 'Poissy', 'célibataire']),
        p('Raymond Rubin est né à Lyon, il habite rue de la Mairie à Paris et il travaille comme chauffeur de bus. Sa femme s’appelle Amanda.',
          ['Rubin', 'Raymond', 'français', 'chauffeur de bus', 'Paris', 'marié']),
        p('Chantal Lemonnier est belge mais elle habite à Paris depuis plus de 20 ans. Elle est retraitée et elle ne s’est jamais mariée.',
          ['Lemonnier', 'Chantal', 'belge', 'retraitée', 'Paris', 'célibataire'])
      ],
      imprimer: () => window.print(),
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); }
    };
  }
}
</script>
</body>
</html>
