<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" />
<style>
  doc-page:not(:defined) { visibility: hidden; }
  @media print { .ecran-seul { display: none !important; } }
  a { color: #1d4e89; }
  a:hover { color: #123a6b; }
</style>
<script src="doc-page.js"></script>
</helmet>

<div class="ecran-seul" style="font-family:Verdana,Tahoma,sans-serif;padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px">
  <div style="font-family:'Archivo Black',Verdana,sans-serif;font-size:16px;letter-spacing:.02em">AFFICHE — LE NOM DE LA CLASSE</div>
  <div style="font-size:11.5px;color:#6b7386;line-height:1.5;max-width:74ch">
    U · P · E · 2 · A, une lettre par page A4, à colorier puis à coller bout à bout au-dessus
    du tableau. Cinq lettres, cinq élèves : le nom de la classe est fabriqué par la classe.
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button onClick="{{ imprimer }}" style="border:none;background:#2a9d6e;color:#fff;border-radius:9px;padding:10px 18px;font-family:'Archivo Black',Verdana,sans-serif;font-size:12px;letter-spacing:.04em;cursor:pointer">IMPRIMER</button>
    <span style="font-size:11.5px;color:#8595a8">Feutres ou crayons de couleur. Sur papier épais si tu veux les garder l'année.</span>
  </div>
</div>

<doc-page size="a4" margin="2cm">

  <section class="page" style="padding:2cm;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
    <img src="clean/lettre-u.webp" alt="U" style="height:160mm;width:auto;max-width:100%;object-fit:contain;display:block" />
  </section>

  <section class="page" style="padding:2cm;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
    <img src="clean/lettre-p.webp" alt="P" style="height:160mm;width:auto;max-width:100%;object-fit:contain;display:block" />
  </section>

  <section class="page" style="padding:2cm;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
    <img src="clean/lettre-e.webp" alt="E" style="height:160mm;width:auto;max-width:100%;object-fit:contain;display:block" />
  </section>

  <section class="page" style="padding:2cm;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
    <img src="clean/lettre-2.webp" alt="2" style="height:160mm;width:auto;max-width:100%;object-fit:contain;display:block" />
  </section>

  <section class="page" style="padding:2cm;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
    <img src="clean/lettre-a.webp" alt="A" style="height:160mm;width:auto;max-width:100%;object-fit:contain;display:block" />
  </section>

</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script>
/* LE NOM DE LA CLASSE (20/09, sa demande) — U P E 2 A à colorier, une lettre par A4.
   Les cinq images viennent de SES deux documents Word (jeu de lettres mandala).
   ⚠ Le premier envoi n'avait pas de E et contenait un S parasite : le S et le 2 étaient
     dans la MÊME image, le 2 a été découpé (moitié droite) et le S jeté.
   ⚠ Le E est en 407 × 569 seulement, bien plus petit que les autres — il s'imprime un peu
     plus mou. Si elle retrouve la même lettre en grand, remplacer `clean/lettre-e.webp`.
   Fichiers : clean/lettre-u · lettre-p · lettre-e · lettre-2 · lettre-a (.webp, fond blanc,
   détourés au plus près de l'encre).
   ⚠ LES CINQ IMAGES ONT UNE HAUTEUR IMPOSÉE DE 160 mm, largeur auto — et surtout PAS un
     `max-height:100%` : collées bout à bout, les lettres doivent faire la même hauteur.
     Un ajustement libre donnait un E à 59 % et un A à 63 % de la hauteur du 2 (le E, plus
     petit que les autres, n'était même jamais agrandi : `height:auto` ne grandit pas).
     160 mm est la valeur maximale possible : le A est la lettre la plus large (1000 × 956),
     à 160 mm il occupe 167 mm des 170 mm de largeur utile entre les marges de 2 cm. */
class Component extends DCLogic {
  renderVals() {
    return { imprimer: () => window.print() };
  }
}

</script>
</body>
</html>
