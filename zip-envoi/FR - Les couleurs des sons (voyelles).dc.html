<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;font-family:Arial, Helvetica, sans-serif;color:#14213d}a{color:#8c1c13}a:hover{color:#5e120c}@media print{.bouton{display:none !important}}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style>
</helmet>
<button class="bouton" onClick="{{ retour }}" style="position:fixed;top:12px;left:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">← L'accueil</button>
<button class="bouton" onClick="{{ imprimer }}" style="position:fixed;top:12px;right:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#2a9d6e;color:#fff;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer">🖨 Imprimer</button>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" orientation="landscape" hint-size="100%,100%">
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
<section class="page" data-screen-label="{{ pg.label }}" style="box-sizing:border-box;padding:20mm;background:#fff;display:flex;flex-direction:column;gap:4mm">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:6mm">
<div style="display:flex;align-items:baseline;gap:5mm"><span style="font-size:22pt;font-weight:700">Les couleurs des sons</span><span style="font-size:16pt;font-weight:700;color:#c62828">{{ pg.titre }}</span></div>
<span style="font-size:12pt">Prénom : ……………………………………</span>
</div>
<div style="font-size:12pt;color:#4a5262">Je vois des lettres ensemble → je cherche la colonne → je dis le son du mot-couleur.</div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:24mm repeat(9,minmax(0,1fr));grid-template-rows:auto 20mm 13mm auto 1fr;border:2px solid #14213d">
<span style="border-bottom:1.5px solid #14213d;border-right:1.5px solid #14213d"></span>
<sc-for list="{{ pg.cols }}" as="c" hint-placeholder-count="9"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5mm;padding:2mm 1mm;border-bottom:1.5px solid #14213d;border-left:1px solid #c9cfd8"><sc-for list="{{ c.g }}" as="g" hint-placeholder-count="3"><span style="font-size:{{ c.taille }};font-weight:700;line-height:1.15;text-align:center">{{ g }}</span></sc-for></div></sc-for>
<div style="display:flex;align-items:center;gap:2mm;padding:0 2mm;border-bottom:1px solid #c9cfd8;border-right:1.5px solid #14213d"><span style="font-size:12pt;font-weight:700">Je colorie</span></div>
<sc-for list="{{ pg.cols }}" as="c" hint-placeholder-count="9"><div style="display:flex;align-items:center;justify-content:center;border-bottom:1px solid #c9cfd8;border-left:1px solid #c9cfd8"><span style="width:15mm;height:13mm;box-sizing:border-box;border:1.5px solid #14213d;border-radius:2mm;background:{{ c.fond }}"></span></div></sc-for>
<div style="display:flex;align-items:center;gap:2mm;padding:0 2mm;border-bottom:1px solid #c9cfd8;border-right:1.5px solid #14213d"><img src="clean/pictos/ecris.webp" alt="" style="width:9mm;height:9mm;object-fit:contain" /><span style="font-size:12pt;font-weight:700">J'écris</span></div>
<sc-for list="{{ pg.cols }}" as="c" hint-placeholder-count="9"><div style="display:flex;align-items:flex-end;justify-content:center;padding:0 2mm 2mm;border-bottom:1px solid #c9cfd8;border-left:1px solid #c9cfd8"><span style="flex:1;border-bottom:1.5px solid #14213d;text-align:center;font-size:12pt;line-height:1.2;white-space:nowrap;font-family:'BA Cursive'">{{ c.ecrit }}</span></div></sc-for>
<div style="display:flex;align-items:center;padding:2mm;border-bottom:1.5px solid #14213d;border-right:1.5px solid #14213d"><span style="font-size:12pt;font-weight:700">Mot-couleur</span></div>
<sc-for list="{{ pg.cols }}" as="c" hint-placeholder-count="9"><div style="display:flex;align-items:center;justify-content:center;padding:2mm 1mm;border-bottom:1.5px solid #14213d;border-left:1px solid #c9cfd8"><span style="font-size:13pt;font-weight:700;text-align:center">{{ c.mot }}</span></div></sc-for>
<div style="display:flex;align-items:flex-start;padding:2mm;border-right:1.5px solid #14213d"><span style="font-size:12pt;font-weight:700">En cuisine</span></div>
<sc-for list="{{ pg.cols }}" as="c" hint-placeholder-count="9"><div style="display:flex;flex-direction:column;align-items:center;gap:2mm;padding:3mm 1mm;border-left:1px solid #c9cfd8"><sc-for list="{{ c.cuisine }}" as="w" hint-placeholder-count="2"><span style="font-size:13pt;text-align:center">{{ w }}</span></sc-for></div></sc-for>
</div>
</section>
</sc-for>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    /* D'après SA page « Les couleurs des sons (voyelles) ». ⚠ SON CODE (06/10) : celui du jeu des
       familles — violet pour è, vert sapin pour in (la page disait « vert » et « cinq »).
       Chaque mot-couleur contient le son : marron [ɔ̃], orange [ɑ̃], rouge [u], jaune [o], rosé [e],
       noir [wa], bleu [ø], (sa)pin [ɛ̃], (vio)let [ɛ]. Page 2 = corrigé, cases coloriées. */
    const COLS = [
      ['marron', '#7b4a26', ['on','om'], ['citron','compote']],
      ['orange', '#f08a24', ['an','am','en','em'], ['viande','menthe']],
      ['rouge', '#d62828', ['ou'], ['soupe','four']],
      ['jaune', '#f6d32d', ['o','au','eau'], ['pomme','sauce','veau']],
      ['rosé', '#f4b6c2', ['é','er','ez'], ['café','éplucher']],
      ['noir', '#111111', ['oi'], ['poire','poivre']],
      ['bleu', '#1f5fbf', ['e','eu','œu'], ['menu','beurre','œuf']],
      ['vert sapin', '#0f5132', ['in','im','un','ain','aim','ein'], ['lapin','pain','faim']],
      ['violet', '#7b3fa0', ['è','ê','ai','ei','et','e + 2 consonnes'], ['crème','lait','poulet','assiette']]
    ];
    const cols = corr => COLS.map(([mot, coul, g, cuisine]) => ({ mot, g, cuisine,
      taille: g.length > 4 ? '13pt' : '17pt', fond: corr ? coul : '#fff', ecrit: corr ? mot : '' }));
    return {
      imprimer: () => window.print(),
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); },
      pages: [{ label: 'Élève', titre: '', cols: cols(false) }, { label: 'Corrigé', titre: 'Corrigé', cols: cols(true) }]
    };
  }
}
</script>
</body>
</html>
