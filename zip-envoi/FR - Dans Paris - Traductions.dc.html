<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4e89}
a:hover{color:#123560}
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">
<section class="page" data-screen-label="Traductions" style="position:relative;background:#fff;display:flex;flex-direction:column;padding:20mm;box-sizing:border-box;overflow:hidden;font-family:Arial, Helvetica, sans-serif;color:#14213d;gap:4mm">
<div style="flex:0 0 auto;display:flex;align-items:center;gap:3mm">
<span style="flex:0 0 auto;width:12mm;height:12mm;box-sizing:border-box;border:2px solid #14213d;border-radius:2mm;background:#fff url('clean/mot-ciseaux.webp') center/contain no-repeat"></span>
<span style="flex:1;min-width:0;font-size:16pt;font-weight:700">Dans Paris — dans ma langue</span>
<span style="flex:0 0 auto;font-size:12pt;color:#4a5262">Paul Éluard</span>
</div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4mm">
<sc-for list="{{ langues }}" as="l" hint-placeholder-count="3">
<div style="border:1.5px dashed #14213d;padding:3mm 4mm;display:flex;gap:4mm;align-items:stretch">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1mm">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:3mm;border-bottom:1px solid #c9cfd8;padding-bottom:1mm">
<span style="font-size:12pt;font-weight:700">{{ l.nom }}</span>
<span style="font-size:14pt;font-weight:700" dir="{{ l.dir }}">{{ l.natif }}</span>
</div>
<div dir="{{ l.dir }}" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(5,auto);grid-auto-flow:column;column-gap:6mm;row-gap:0.5mm">
<sc-for list="{{ l.vers }}" as="v" hint-placeholder-count="10">
<span style="{{ l.style }}">{{ v }}</span>
</sc-for>
</div>
</div>
<sc-if value="{{ l.qr }}" hint-placeholder-val="{{ false }}">
<div style="flex:0 0 auto;width:30mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;border-left:1px solid #c9cfd8;padding-left:4mm">
<div style="width:28mm;height:28mm;background:#fff url('docs/qr-dans-paris-arabe-egyptien.png') center/contain no-repeat"></div>
<div style="display:flex;align-items:center;gap:1.5mm">
<span style="flex:0 0 auto;width:9mm;height:9mm;box-sizing:border-box;border:2px solid #14213d;border-radius:1.5mm;background:#fff url('clean/pictos/ecoute.webp') center/contain no-repeat"></span>
<span style="font-size:12pt;font-weight:700">J'écoute.</span>
</div>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="flex:0 0 auto;font-size:12pt;color:#4a5262;text-align:center">Je découpe ma langue. Je la colle.</div>
</section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Traductions de « Dans Paris » — FEUILLE À PART du livret (24/09, sa demande : « ils
   collent à l'extérieur du livret »). Pachto et portugais : SES textes, tels quels.
   Arabe : en ÉGYPTIEN (son élève ne parle pas l'arabe standard), le texte même que lit la
   page « FR - Dans Paris - en arabe égyptien » — le QR du bloc pointe dessus.
   Première moitié seulement : elle n'a pas encore la partie « … renversa ». */
const RTL = 'font-size:14pt;line-height:1.45;text-align:right';
const LTR = 'font-size:12pt;line-height:1.45';
const LANGUES = [
  { nom: 'Pachto', natif: 'پښتو', dir: 'rtl', style: RTL, vers: [
    'په پاریس کې یوه کوڅه ده.', 'په دې کوڅه کې یو کور دی.', 'په دې کور کې یوه زینه ده.',
    'په دې زینه کې یوه کوټه ده.', 'په دې کوټه کې یو مېز دی.', 'په دې مېز باندې یو قالین دی.',
    'په دې قالین باندې یوه پنجره ده.', 'په دې پنجره کې یوه ځاله ده.', 'په دې ځاله کې یوه هګۍ ده.',
    'په دې هګۍ کې یو مرغه دی.'] },
  { nom: 'Arabe égyptien', natif: 'مصري', dir: 'rtl', style: RTL, qr: true, vers: [
    'في باريس، فيه شارع.', 'في الشارع ده، فيه بيت.', 'في البيت ده، فيه سلّم.',
    'في السلّم ده، فيه أوضة.', 'في الأوضة دي، فيه ترابيزة.', 'على الترابيزة دي، فيه سجّادة.',
    'على السجّادة دي، فيه قفص.', 'في القفص ده، فيه عشّ.', 'في العشّ ده، فيه بيضة.',
    'في البيضة دي، فيه عصفور.'] },
  { nom: 'Portugais', natif: 'Português', dir: 'ltr', style: LTR, vers: [
    'Em Paris, há uma rua.', 'Nessa rua, há uma casa.', 'Nessa casa, há uma escada.',
    'Nessa escada, há um quarto.', 'Nesse quarto, há uma mesa.', 'Sobre essa mesa, há um tapete.',
    'Sobre esse tapete, há uma gaiola.', 'Nessa gaiola, há um ninho.', 'Nesse ninho, há um ovo.',
    'Nesse ovo, há um pássaro.'] }];
class Component extends DCLogic {
  renderVals() { return { langues: LANGUES.map(l => ({ qr: false, ...l })) }; }
}
</script>
</body>
</html>
