<script type="text/x-dc" data-dc-script>
/* 11/10 (sa demande, d'après son Genially « BOWLING - VERBES ») : une image, 3 phrases, l'élève touche la bonne.
   Bonne réponse → la boule roule et fait tomber les quilles + BRAVO ! ; erreur → la boule part dans la rigole,
   OH ZUT !, la phrase fausse se grise et il recommence. Pas de score. Manche de 6 images, « Encore ».
   Images = SES images de verbes (clean/mot-*.webp). Pièges : un autre verbe (même pronom) + le même verbe
   avec l'autre pronom (comme « Elle va à l'école / Il va à l'école » dans son Genially). 🔊 lit chaque phrase. */
const V = [
  ['boire', 'elle', 'boit'], ['dormir', 'elle', 'dort'], ['laver', 'elle', 'se lave'], ['manger', 'elle', 'mange'],
  ['rever', 'il', 'rêve'], ['lire', 'il', 'lit'], ['ecrire', 'elle', 'écrit'], ['ecouter', 'il', 'écoute'],
  ['reveiller', 'il', 'se réveille'], ['aller-ecole', 'il', 'va à l’école'], ['habiller', 'il', 's’habille', 'sans-pronom'], ['parler', 'elle', 'parle'], ['marcher', 'il', 'marche'], ['course', 'il', 'court'], ['regarder', 'il', 'regarde']];
const BRAVOS = ['Super !', 'Bravo !', 'Génial !', 'Très bien !', 'Parfait !', 'Gagné !'];
/* Triangle vu de face, en perspective : rangée du fond plus haute et plus petite. [x %, y %, largeur px] */
const QUILLES = [[50, 19, 42], [46, 15.5, 38], [54, 15.5, 38], [42, 12, 34], [50, 12, 34], [58, 12, 34], [38, 8.5, 30], [46, 8.5, 30], [54, 8.5, 30], [62, 8.5, 30]];
const melange = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const phrase = (pr, v) => (pr === 'il' ? 'Il ' : 'Elle ') + v + '.';

class Component extends DCLogic {
  state = { etape: 'accueil', liste: [], rang: 0, choix: [], faux: [], phase: 'q', bravo: '' };
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.tf); try { speechSynthesis.cancel(); } catch (e) {} }
  dire(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; u.rate = 0.85; const v = speechSynthesis.getVoices().find(x => /^fr/i.test(x.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
  /* 11/10 « le bruit comme si j'étais dans un bowling » : grondement de la boule qui roule (bruit filtré grave),
     puis fracas des quilles (claquements de bois + éclat) — ou, dans la rigole, roulement creux et « clonk ». */
  son(bon) {
    try {
      const C = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)()); if (C.state === 'suspended') C.resume();
      const t = C.currentTime, sr = C.sampleRate;
      const bruit = d => { const b = C.createBuffer(1, Math.ceil(sr * d), sr), x = b.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; const s = C.createBufferSource(); s.buffer = b; return s; };
      const roule = (debut, duree, coupure, fort) => { const s = bruit(duree), f = C.createBiquadFilter(), g = C.createGain(); f.type = 'lowpass'; f.frequency.setValueAtTime(coupure * 0.6, t + debut); f.frequency.linearRampToValueAtTime(coupure, t + debut + duree);
        g.gain.setValueAtTime(0.0001, t + debut); g.gain.exponentialRampToValueAtTime(fort, t + debut + 0.12); g.gain.setValueAtTime(fort, t + debut + duree - 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + debut + duree);
        s.connect(f); f.connect(g); g.connect(C.destination); s.start(t + debut); s.stop(t + debut + duree);
        const o = C.createOscillator(), go = C.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(48, t + debut); o.frequency.linearRampToValueAtTime(62, t + debut + duree); go.gain.setValueAtTime(0.0001, t + debut); go.gain.exponentialRampToValueAtTime(fort * 0.5, t + debut + 0.15); go.gain.exponentialRampToValueAtTime(0.0001, t + debut + duree); o.connect(go); go.connect(C.destination); o.start(t + debut); o.stop(t + debut + duree); };
      const choc = (quand, f0, f1, fort, d) => { const o = C.createOscillator(), g = C.createGain(); o.frequency.setValueAtTime(f0, t + quand); o.frequency.exponentialRampToValueAtTime(f1, t + quand + d); g.gain.setValueAtTime(fort, t + quand); g.gain.exponentialRampToValueAtTime(0.0001, t + quand + d); o.connect(g); g.connect(C.destination); o.start(t + quand); o.stop(t + quand + d + 0.02); };
      const clac = (quand, freq, fort) => { const s = bruit(0.09), f = C.createBiquadFilter(), g = C.createGain(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 9; g.gain.setValueAtTime(fort, t + quand); g.gain.exponentialRampToValueAtTime(0.0001, t + quand + 0.09); s.connect(f); f.connect(g); g.connect(C.destination); s.start(t + quand); s.stop(t + quand + 0.1); };
      if (bon) {
        roule(0, 0.88, 420, 0.5);
        /* 11/10 « le bruit contre les quilles ça ne va pas » : plus de souffle (il faisait « grésillement »).
           Une quille = un coup de BOIS creux : impulsion très courte dans 3 résonateurs accordés (≈ 1 : 2,3 : 4,1),
           un peu désaccordés d'une quille à l'autre. Gros impact sur la quille de tête, puis cascade qui s'éteint,
           et les quilles qui retombent au sol (coups plus graves). */
        const bois = (quand, base, fort, duree) => {
          const s = bruit(0.012), sortie = C.createGain(); sortie.gain.value = fort; sortie.connect(C.destination);
          [[1, 1, 22], [2.31, 0.55, 26], [4.1, 0.28, 30]].forEach(([r, a, q]) => { const f = C.createBiquadFilter(), g = C.createGain(); f.type = 'bandpass'; f.frequency.value = base * r; f.Q.value = q;
            g.gain.setValueAtTime(a * 9, t + quand); g.gain.exponentialRampToValueAtTime(0.0001, t + quand + duree); s.connect(f); f.connect(g); g.connect(sortie); });
          s.start(t + quand); s.stop(t + quand + 0.02); };
        choc(0.85, 120, 60, 0.5, 0.16);
        bois(0.855, 720, 1.0, 0.22); bois(0.87, 660, 0.9, 0.2); bois(0.885, 790, 0.8, 0.2);
        for (let i = 0; i < 16; i++) { const q = 0.9 + Math.pow(Math.random(), 1.6) * 0.55; bois(q, 560 + Math.random() * 420, 0.75 * (1 - (q - 0.9) / 0.75), 0.12 + Math.random() * 0.1); }
        for (let i = 0; i < 6; i++) { const q = 1.1 + Math.random() * 0.4; bois(q, 230 + Math.random() * 90, 0.45, 0.14); }
      } else {
        choc(0.28, 95, 45, 0.55, 0.2);
        roule(0.3, 1.25, 260, 0.38);
        const o = C.createOscillator(), g = C.createGain(); o.connect(g); g.connect(C.destination); o.frequency.setValueAtTime(300, t + 1.55); o.frequency.exponentialRampToValueAtTime(130, t + 1.95); g.gain.setValueAtTime(0.12, t + 1.55); g.gain.exponentialRampToValueAtTime(0.0001, t + 2); o.start(t + 1.55); o.stop(t + 2.05);
      }
    } catch (e) {}
  }
  sonAncien(bon) { try { const C = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)()), t = C.currentTime;
    if (bon) { for (let i = 0; i < 6; i++) { const o = C.createOscillator(), g = C.createGain(); o.type = 'square'; o.frequency.value = 120 + Math.random() * 240; o.connect(g); g.connect(C.destination); g.gain.setValueAtTime(0.06, t + 0.9 + i * 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1 + i * 0.03); o.start(t + 0.9 + i * 0.03); o.stop(t + 1.15 + i * 0.03); } }
    else { const o = C.createOscillator(), g = C.createGain(); o.connect(g); g.connect(C.destination); o.frequency.setValueAtTime(330, t + 0.6); o.frequency.exponentialRampToValueAtTime(140, t + 1); g.gain.setValueAtTime(0.16, t + 0.6); g.gain.exponentialRampToValueAtTime(0.001, t + 1.05); o.start(t + 0.6); o.stop(t + 1.1); } } catch (e) {} }
  nouvellePartie = () => { this.setState({ etape: 'jeu', liste: melange(V).slice(0, 6), rang: 0 }, () => this.question()); };
  question() {
    const s = this.state, [, pr, v] = s.liste[s.rang], proches = [['marche', 'va à l’école']], interdit = (proches.find(p => p.includes(v)) || []), autre = melange(V.filter(x => x[2] !== v && !interdit.includes(x[2])))[0];
    /* « s'habille » : la tête est cachée dans le pull, on ne voit pas si c'est il ou elle → pas de piège sur le pronom, deux autres verbes. */
    const sansPr = s.liste[s.rang][3] === 'sans-pronom', autre2 = melange(V.filter(x => x[2] !== v && x[2] !== autre[2] && !interdit.includes(x[2])))[0];
    const choix = melange([{ t: phrase(pr, v), bon: true }, { t: phrase(pr, autre[2]), bon: false }, sansPr ? { t: phrase(pr, autre2[2]), bon: false } : { t: phrase(pr === 'il' ? 'elle' : 'il', v), bon: false }]);
    this.setState({ choix, faux: [], phase: 'q', bravo: '' });
  }
  choisir(i) {
    const s = this.state; if (s.phase !== 'q' || s.faux.includes(i)) return;
    if (s.choix[i].bon) {
      this.son(true); this.setState({ phase: 'roule', fond: false, bravo: BRAVOS[Math.floor(Math.random() * BRAVOS.length)] });
      this.tf = setTimeout(() => this.setState({ fond: true }), 860);
      this.t = setTimeout(() => { if (s.rang + 1 >= s.liste.length) this.setState({ etape: 'fin' }); else this.setState({ rang: s.rang + 1 }, () => this.question()); }, 2600);
    } else {
      this.son(false); this.setState({ phase: 'rigole', faux: s.faux.concat([i]) });
      this.t = setTimeout(() => { this.setState({ phase: 'rigole2' }); this.t = setTimeout(() => this.setState({ phase: 'q' }), 1500); }, 320);
    }
  }
  renderVals() {
    const s = this.state, q = s.liste[s.rang] || V[0], ph = s.phase;
    const cote = this.cote || (this.cote = 1); if ((ph === 'rigole' || ph === 'rigole2') && !this.dejaCote) { this.cote = Math.random() < 0.5 ? -1 : 1; this.dejaCote = true; } if (ph !== 'rigole' && ph !== 'rigole2') this.dejaCote = false;
    return {
      aAccueil: s.etape === 'accueil', enJeu: s.etape === 'jeu', finPartie: s.etape === 'fin',
      carres: (s.liste.length ? s.liste : Array(6).fill(0)).map((_, i) => ({ fond: s.etape === 'fin' || i < s.rang || (i === s.rang && ph === 'roule') ? '#2a9d6e' : i === s.rang && s.etape === 'jeu' ? '#ffd23f' : 'transparent' })),
      image: 'clean/mot-' + q[0] + '.webp',
      phrases: s.choix.map((c, i) => { const f = s.faux.includes(i), ok = ph === 'roule' && c.bon;
        return { texte: c.t, debut: /^Il /.test(c.t) ? 'I' : '', reste: /^Il /.test(c.t) ? c.t.slice(1) : c.t, fond: ok ? '#2a9d6e' : f ? '#f3d3cf' : '#fff', encre: ok ? '#fff' : '#1f1b2e', bord: ok ? '#2a9d6e' : f ? '#e2463a' : '#fff', op: f ? 0.55 : 1,
          ecouter: () => this.dire(c.t), choisir: () => this.choisir(i) }; }),
      /* Les quilles tombent QUAND la boule arrive (0,85 s) : la tête d'abord, puis le fond, chacune vers l'extérieur. */
      quilles: QUILLES.map(([x, y, w], i) => { const tombe = ph === 'roule', sens = x < 50 ? -1 : x > 50 ? 1 : (i ? 1 : -1);
        return { x: x + '%', y: y + '%', w: w + 'px', m: (-w / 2) + 'px', z: Math.round(y), tr: tombe ? 'translate(' + (sens * (18 + Math.abs(x - 50) * 4)) + 'px,' + (-6 - (19 - y) * 2) + 'px) rotate(' + (sens * (75 + i * 6)) + 'deg)' : 'none', op: tombe ? 0 : 1, delai: tombe ? (0.82 + (19 - y) * 0.018).toFixed(2) + 's' : '0s', delaiOp: tombe ? (1.5 + (19 - y) * 0.018).toFixed(2) + 's' : '0s' }; }),
      /* La boule roule JUSQU'AUX quilles (sa demande) : elle s'arrête sur la quille de tête, puis les quilles tombent. */
      /* Erreur : la boule TOMBE dans la rigole (incurvée), puis roule dedans jusqu'au fond, sans toucher les quilles. */
      bouleX: ph === 'rigole' ? (50 + this.cote * 37) + '%' : ph === 'rigole2' ? (50 + this.cote * 24.5) + '%' : '50%',
      /* Gagné : la boule arrive aux quilles, les renverse, puis CONTINUE et tombe dans la fosse derrière (elle ne reste plus devant). */
      bouleBas: ph === 'roule' ? (s.fond ? '84%' : '66%') : ph === 'rigole' ? '10px' : ph === 'rigole2' ? '70%' : '22px',
      bouleTaille: ph === 'q' ? '70px' : ph === 'rigole' ? '54px' : ph === 'roule' && s.fond ? '20px' : '30px',
      bouleZ: ph === 'roule' ? (s.fond ? 5 : 30) : 25,
      bouleOp: ph === 'roule' && s.fond ? 0 : 1,
      bouleDuree: ph === 'q' ? '0s' : ph === 'rigole' ? '0.3s' : ph === 'roule' && s.fond ? '0.45s' : '0.9s',
      aMessage: ph === 'roule' || ph === 'rigole' || ph === 'rigole2',
      message: ph === 'roule' ? s.bravo : 'OH ZUT !', messageCouleur: ph === 'roule' ? '#e8508f' : '#1f1f1f',
      quillesAccueil: QUILLES.map(([x, y, w]) => ({ x: x + '%', y: (y - 2) + '%', w: Math.round(w * 1.5) + 'px', m: Math.round(-w * 0.75) + 'px', z: Math.round(y) })),
      nouvellePartie: this.nouvellePartie,
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); }
    };
  }
}
