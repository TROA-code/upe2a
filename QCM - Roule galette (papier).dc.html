<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;font-family:Archivo, Verdana, sans-serif;color:#12233b}a{color:#1d4e89}a:hover{color:#12233b}@media print{.no-print{display:none !important}}</style>
</helmet>
<div class="no-print" style="position:fixed;top:12px;right:12px;z-index:50;display:flex;gap:8px">
<button class="bouton" onClick="{{ imprimer }}" style="min-height:44px;border:none;border-radius:10px;background:#2a7d4f;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">Imprimer</button>
<button class="bouton" onClick="{{ retour }}" style="min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">← Retour</button>
</div>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" hint-size="100%,100%">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
<section class="page" data-screen-label="{{ p.label }}" style="box-sizing:border-box;padding:20mm;font-family:Archivo, Verdana, sans-serif;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:2mm;overflow:hidden">
<sc-if value="{{ p.entete }}" hint-placeholder-val="{{ true }}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:6mm;font-size:12pt;color:#4a5568"><span>Roule galette · Je comprends l'histoire</span><span>Prénom : ……………………………</span></div></sc-if>
<div style="display:flex;align-items:center;gap:5mm"><img src="clean/pictos/entoure.webp" alt="" style="width:12mm;height:12mm;object-fit:contain;flex:0 0 auto" /><span style="font-family:Archivo Black, Archivo, sans-serif;font-size:18pt">J'entoure la bonne réponse.</span></div>
<sc-for list="{{ p.questions }}" as="q" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:1.5mm">
<div style="display:flex;align-items:baseline;gap:4mm"><span style="font-family:Archivo Black, Archivo, sans-serif;font-size:20pt;line-height:1;flex:0 0 auto">{{ q.num }}</span><span style="font-size:13pt;font-weight:700;line-height:1.2;text-wrap:pretty">{{ q.texte }}</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm">
<sc-for list="{{ q.reponses }}" as="r" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;border:0.4mm solid #12233b;border-radius:3mm;overflow:hidden;background:#fff">
<sc-if value="{{ r.aImage }}" hint-placeholder-val="{{ true }}">
<img src="{{ r.src }}" alt="" style="display:block;width:100%;height:17mm;object-fit:contain;background:#fff" />
</sc-if>
<span style="display:flex;align-items:center;justify-content:center;text-align:center;min-height:{{ r.haut }};padding:1.5mm 2mm;font-size:{{ r.taille }};font-weight:700;line-height:1.2">{{ r.texte }}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</section>
</sc-for>
<section class="page" data-screen-label="Corrigé" style="box-sizing:border-box;padding:20mm;font-family:Archivo, Verdana, sans-serif;font-size:13pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:5mm;overflow:hidden">
<div style="font-family:Archivo Black, Archivo, sans-serif;font-size:24pt;color:#c62828">Corrigé</div>
<sc-for list="{{ corrige }}" as="c" hint-placeholder-count="9">
<div style="display:flex;gap:5mm;align-items:baseline"><span style="font-family:Archivo Black, Archivo, sans-serif;font-size:16pt;width:8mm;flex:0 0 auto">{{ c.num }}</span><div style="display:flex;flex-direction:column;gap:1mm"><span>{{ c.q }}</span><span style="font-weight:700;color:#2a7d4f">→ {{ c.r }}</span></div></div>
</sc-for>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* 11/10 : version papier du QCM « Roule galette » (mêmes 9 questions, mêmes images que QCM - Roule galette.dc.html).
   Ordre des réponses fixe (permutation ci-dessous) pour que le corrigé corresponde à la feuille. */
const Q = [
  ['Qui fait la galette ?', [['vieille', 'La vieille'], ['fils', 'Le fils'], ['tante', 'La tante']], 0],
  ['Pour qui la fait-elle ?', [['mari', 'Son mari'], ['fille', 'Sa fille'], ['niece', 'Sa nièce']], 0],
  ['Où est-ce que la vieille trouve le blé pour la farine ?', [['pot', 'Dans un pot près de la cheminée'], ['moulin', 'Au moulin'], ['grenier', 'En balayant le grenier']], 2],
  ['Pourquoi la vieille met-elle la galette sur la fenêtre ?', [['chat', 'Parce que le chat veut la manger.'], ['refroidir', 'Pour la faire refroidir.'], ['cuisine', 'Parce qu’il n’y a plus de place dans la cuisine.']], 1],
  ['Quel est le premier animal que la galette rencontre ?', [['renard', 'Le renard'], ['lapin', 'Le lapin'], ['ours', 'L’ours']], 1],
  ['Combien d’animaux la galette rencontre-t-elle ?', [[null, '2'], [null, '4'], [null, '6']], 1, 'chiffre'],
  ['Le renard dit à la galette qu’elle est…', [[null, 'petite et rapide'], [null, 'belle et gentille'], [null, 'ronde et blonde']], 2],
  ['Que dit le renard à la galette pour qu’elle s’approche ?', [['renard-cadeau', 'J’ai un cadeau pour toi.'], ['renard-sentir', 'Comme tu sens bon.'], ['renard-sourd', 'Je suis sourd.']], 2],
  ['Qui réussit à manger la galette ?', [['loup', 'Le loup'], ['ours', 'L’ours'], ['renard', 'Le renard']], 2]];
const ORDRE = [[1, 0, 2], [2, 1, 0], [0, 2, 1], [1, 2, 0], [2, 1, 0], [0, 1, 2], [1, 2, 0], [0, 2, 1], [2, 0, 1]];
class Component extends DCLogic {
  /* 11/10 : deux versions rangées dans l'Espace enseignant — `?images=1` = avec les images (2 pages), sinon sans (1 page). */
  renderVals() {
    const img = /[?&]images=1/.test(location.search);
    const qs = Q.map((q, i) => ({
      num: String(i + 1), texte: q[0],
      reponses: ORDRE[i].map(j => { const [f, t] = q[1][j];
        return img ? { texte: t, aImage: !!f, src: f ? 'clean/qcm-galette-' + f + '.webp' : '', haut: f ? '11mm' : '16mm', taille: f ? '12pt' : q[3] === 'chiffre' ? '30pt' : '14pt' }
                   : { texte: t, aImage: false, src: '', haut: '9mm', taille: q[3] === 'chiffre' ? '18pt' : '12pt' }; })
    }));
    const pages = (img ? [[0, 5], [5, 9]] : [[0, 9]]).map(([a, b], n) => ({ n: String(n + 1), entete: n === 0, label: String(n + 1).padStart(2, '0') + ' Questions ' + (a + 1) + '-' + b, questions: qs.slice(a, b) }));
    return {
      pages,
      corrige: Q.map((q, i) => ({ num: String(i + 1), q: q[0], r: q[1][q[2]][1] })),
      imprimer: () => window.print(),
      retour: () => { if (history.length > 1) history.back(); else location.href = 'APPLI - Espace enseignant.dc.html' + (location.search || ''); }
    };
  }
}
</script>
</body>
</html>
