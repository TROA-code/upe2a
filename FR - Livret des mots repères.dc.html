<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d5c3a}
a:hover{color:#14213d}
</style>
<link rel="preload" href="fonts/BelleAllureScript2i-Gros.otf" as="font" type="font/otf" crossorigin="" />
<link rel="preload" href="fonts/BelleAllureCE-Gros.otf" as="font" type="font/otf" crossorigin="" />
<link rel="stylesheet" href="polices.css" />
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">

<section class="page" data-screen-label="Page de garde" style="position:relative;background:#fff;display:flex;flex-direction:column;padding:20mm;box-sizing:border-box;overflow:hidden;font-family:Arial, Helvetica, sans-serif;color:#14213d;gap:6mm">
<div style="flex:0 0 auto;background:#1d5c3a;color:#fff;padding:8mm 8mm 7mm;display:flex;flex-direction:column;gap:2mm">
<span style="font-size:13pt;letter-spacing:0.3em">D E &nbsp; A &nbsp; À &nbsp; Z</span>
<span style="font-size:44pt;font-weight:700;letter-spacing:0.02em;line-height:1">MES MOTS REPÈRES</span>
</div>
<div style="flex:0 0 auto;height:1.5mm;background:#e0a526;margin-top:-6mm"></div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:2.5mm">
<sc-for list="{{ mosaique }}" as="m" hint-placeholder-count="30">
<div style="position:relative;border:1.5px solid #d8dbe4;border-radius:2mm;background:#fff;min-height:0">
<div style="position:absolute;inset:2mm 2mm 7mm 2mm;{{ m.fond }}"></div>
<span style="position:absolute;left:0;right:0;bottom:1mm;text-align:center;font-family:'BA Script', Arial, sans-serif;font-size:12pt;line-height:1">{{ m.lettre }}</span>
</div>
</sc-for>
</div>
<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:5mm;font-size:14pt">
<div style="display:flex;align-items:flex-end;gap:3mm"><span style="font-weight:700">Prénom :</span><span style="flex:1;border-bottom:1.5px solid #14213d;height:7mm"></span></div>
<div style="display:flex;align-items:flex-end;gap:3mm"><span style="font-weight:700">Classe :</span><span style="flex:1;border-bottom:1.5px solid #14213d;height:7mm"></span></div>
</div>
</section>

<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="13">
<section class="page" data-screen-label="{{ pg.label }}" style="position:relative;background:#fff;display:flex;flex-direction:column;padding:20mm;box-sizing:border-box;overflow:hidden;font-family:Arial, Helvetica, sans-serif;color:#14213d;gap:0">
<sc-for list="{{ pg.lettres }}" as="L" hint-placeholder-count="2">
<div style="flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:2.5mm;padding:2mm 0 4mm;border-bottom:1.5px dashed #c9cfd8">
<div style="flex:1;min-height:0;display:flex;gap:6mm;align-items:stretch">
<div style="flex:0 0 58mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:2px solid #1d5c3a;border-radius:3mm;overflow:hidden">
<span style="display:flex;align-items:center;justify-content:center;font-family:'BA Script', Arial, sans-serif;font-size:40pt;line-height:1;background:#eef5f0">{{ L.cap }}</span>
<span style="display:flex;align-items:center;justify-content:center;font-family:'BA Script', Arial, sans-serif;font-size:40pt;line-height:1;background:#eef5f0;border-left:1.5px solid #cfe0d5">{{ L.min }}</span>
<span style="display:flex;align-items:center;justify-content:center;font-family:'BA Cursive', cursive;font-size:40pt;line-height:1;color:#1d5c3a;border-top:1.5px solid #cfe0d5">{{ L.cap }}</span>
<span style="display:flex;align-items:center;justify-content:center;font-family:'BA Cursive', cursive;font-size:40pt;line-height:1;color:#1d5c3a;border-top:1.5px solid #cfe0d5;border-left:1.5px solid #cfe0d5">{{ L.minC }}</span>
</div>
<div style="flex:1;min-width:0;display:flex;gap:5mm">
<sc-for list="{{ L.mots }}" as="m" hint-placeholder-count="1">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1mm">
<div style="flex:1;min-height:0;width:100%;{{ m.fond }}"></div>
<span style="flex:0 0 auto;font-size:15pt;font-weight:700;letter-spacing:0.04em">{{ m.cap }}</span>
</div>
</sc-for>
</div>
</div>
<sc-for list="{{ L.lignes }}" as="l" hint-placeholder-count="2">
<div style="flex:0 0 auto;height:14.8mm;display:flex;align-items:center;gap:4mm">
<span style="flex:0 0 22mm;font-size:12pt;color:#4a5262">{{ l.nom }}</span>
<div style="flex:0 0 auto">{{ l.svg }}</div>
</div>
</sc-for>
</div>
</sc-for>
<div style="flex:0 0 auto;display:flex;justify-content:flex-end;padding-top:2mm"><span style="min-width:9mm;height:9mm;box-sizing:border-box;border:1.5px solid #14213d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12pt;font-weight:700">{{ pg.num }}</span></div>
</section>
</sc-for>

</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* LIVRET DES MOTS REPÈRES (25/09, sa demande : « un livret sympa avec une page de garde,
   pour qu'ils les apprennent »). ORDRE DE L'ALPHABET (« l'ordre c'est l'alphabet ! »).
   2 lettres par page, 2 cm de marge, ligne d'écriture en SCRIPT et en CURSIVE (réglure 3 mm
   exacte de ses étiquettes de graphisme).
   ⚠ Les mots repères vivent à TROIS endroits (ALPHA_IMG, banque-mots.js, livre interactif) :
   cette liste en est une COPIE — la corriger avec les trois. c, g, o, s ont deux mots ;
   le h est VIDE (il n'a pas de son). */
const MOTS = [['a','ananas','ANANAS'],['b','ballon','BALLON'],['c','carotte','CAROTTE et CERISE','cerise'],['d','deux','DEUX'],['e','je','JE'],['f','fenetre','FENÊTRE'],['g','gateau','GÂTEAU et GILET','gilet'],['h','',''],['i','immeuble','IMMEUBLE'],['j','jaune','JAUNE'],['k','kiwi','KIWI'],['l','lit','LIT'],['m','moto','MOTO'],['n','nuage','NUAGE'],['o','ordinateur','ORDINATEUR et POT','pot'],['p','pied','PIED'],['q','quatre','QUATRE'],['r','robot','ROBOT'],['s','salade','SALADE et ROSE','rose'],['t','table','TABLE'],['u','usine','USINE'],['v','velo','VÉLO'],['w','wagon','WAGON'],['x','xylophone','XYLOPHONE'],['y','pyjama','PYJAMA'],['z','zero','ZÉRO']];
const ph = f => "background:url('clean/mot-" + f + ".webp') center/contain no-repeat";
/* Réglure construite ici (un trou {{ }} dans un <text> SVG n'est pas peint). Géométrie
   de ses étiquettes 3 mm : texte à y 88, corps 69. Le modèle est CLAIR, à repasser, puis
   l'élève continue seul sur la même ligne. */
const REGL = (t, police) => React.createElement('svg',
  { viewBox: '0 0 1340 148', style: { width: '134mm', height: '14.8mm', display: 'block', overflow: 'visible' } },
  React.createElement('rect', { x: 2, y: 3, width: 108, height: 55, fill: '#cfe6f8' }),
  React.createElement('rect', { x: 2, y: 58, width: 108, height: 30, fill: '#93c45f' }),
  React.createElement('rect', { x: 2, y: 88, width: 108, height: 57, fill: '#c08f61' }),
  ...[[3,'#2f5fd0',2],[30,'#b9bfc8',1.6],[58,'#3aa03a',2.2],[88,'#8a5a2b',2.6],[116,'#b9bfc8',1.6],[145,'#d94a3d',1.6]]
    .map(([y, s, w]) => React.createElement('line', { key: y, x1: 0, y1: y, x2: 1340, y2: y, stroke: s, strokeWidth: w })),
  React.createElement('text', { x: 140, y: 88, fontFamily: police, fontSize: 69, fill: '#b8c7dc' }, t));
const SCRIPT = 'BA Script, sans-serif', CURSIVE = 'BA Cursive, cursive';

class Component extends DCLogic {
  renderVals() {
    const lettres = MOTS.map(([l, f1, label, f2]) => {
      const ecrits = label ? label.split(' et ') : [];
      const fichiers = [f1, f2].filter(Boolean);
      const mots = fichiers.map((f, i) => ({ fond: ph(f), cap: ecrits[i] || '', min: (ecrits[i] || '').toLocaleLowerCase('fr-FR') }));
      const lignes = [];
      mots.forEach(m => {
        lignes.push({ nom: 'script', svg: REGL(m.min, SCRIPT) });
        lignes.push({ nom: 'cursive', svg: REGL(m.min, CURSIVE) });
      });
      return { cap: l.toUpperCase(), min: l === 'a' ? 'a \u0251' : l, minC: l, mots, lignes };
    });
    const pages = [];
    for (let i = 0; i < lettres.length; i += 2) {
      const p = lettres.slice(i, i + 2);
      pages.push({ lettres: p, num: pages.length + 2, label: p.map(x => x.cap).join(' · ') });
    }
    const mosaique = [];
    MOTS.forEach(([l, f1, , f2]) => [f1, f2].filter(Boolean).forEach(f => mosaique.push({ lettre: l, fond: ph(f) })));
    return { pages, mosaique };
  }
}
</script>
</body>
</html>
