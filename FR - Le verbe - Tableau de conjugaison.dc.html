<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;font-family:Andika, Archivo, Verdana, sans-serif;color:#12233b}a{color:#1d4e89}a:hover{color:#12233b}@media print{.bouton{display:none !important}}</style>
</helmet>
<button class="bouton" onClick="{{ retour }}" style="position:fixed;top:12px;left:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">← L'accueil</button>
<button class="bouton" onClick="{{ imprimer }}" style="position:fixed;top:12px;right:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#2a9d6e;color:#fff;padding:0 18px;font-weight:700;font-size:15px;font-family:Arial, Helvetica, sans-serif;cursor:pointer">🖨 Imprimer</button>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" hint-size="100%,100%">
<section class="page" data-screen-label="01" style="box-sizing:border-box;padding:20mm;font-family:Andika, Archivo, Verdana, sans-serif;font-size:14pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:5mm">
<div style="flex:0 0 auto;background:#12233b;color:#fff;padding:3mm 6mm;display:flex;align-items:baseline;justify-content:space-between;gap:6mm">
<span style="font-size:22pt;font-weight:700;letter-spacing:0.04em">LE VERBE AU PRÉSENT</span>
<span style="font-size:13pt">les verbes en <span style="text-decoration:underline;font-weight:700">-ER</span></span>
</div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:5mm">
<sc-for list="{{ verbes }}" as="v" hint-placeholder-count="6">
<div style="border:1.5px solid #12233b;display:flex;flex-direction:column;min-height:0">
<div style="flex:0 0 auto;display:flex;align-items:center;gap:4mm;padding:2mm 4mm;border-bottom:1.5px solid #12233b;background:#eef1f5">
<sc-if value="{{ v.photo }}" hint-placeholder-val="{{ true }}"><img src="{{ v.img }}" alt="" style="width:16mm;height:16mm;object-fit:contain;background:#fff" /></sc-if>
<span style="font-size:20pt;font-weight:700;letter-spacing:0.05em">{{ v.inf }}</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:1mm 4mm">
<sc-for list="{{ v.lignes }}" as="l" hint-placeholder-count="6">
<div style="display:grid;grid-template-columns:27mm 1fr;align-items:baseline;font-size:16pt;line-height:1.2">
<span style="color:#4a5568">{{ l.pr }}</span>
<span>{{ l.rad }}<span style="font-weight:700;text-decoration:underline">{{ l.fin }}</span></span>
</div>
</sc-for>
</div>
<sc-if value="{{ v.note }}" hint-placeholder-val="{{ false }}"><span style="flex:0 0 auto;font-size:12pt;padding:0 4mm 1.5mm;color:#4a5568">{{ v.note }}</span></sc-if>
</div>
</sc-for>
</div>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Tableau de conjugaison, présent des verbes en -ER (08/10, sa demande) : marcher, danser, manger
   + parler, chanter, regarder (photos mot- existantes ; pas de photo pour danser). Terminaison en
   gras souligné (impression N&B). Une page A4, 2 cm de marge. */
const PR = ['je', 'tu', 'il / elle', 'nous', 'vous', 'ils / elles'];
const FIN = ['e', 'es', 'e', 'ons', 'ez', 'ent'];
class Component extends DCLogic {
  renderVals() {
    const v = (inf, photo, note) => {
      const rad = inf.slice(0, -2);
      return {
        inf: inf.toUpperCase(), photo: !!photo, img: photo ? 'clean/mot-' + inf + '.webp' : '', note: note || '',
        lignes: PR.map((pr, i) => ({ pr, rad: (inf === 'manger' && i === 3) ? 'mange' : rad, fin: FIN[i] }))
      };
    };
    return {
      verbes: [
        v('marcher', true), v('danser', false), v('manger', true, 'nous mangeons : on garde le e.'),
        v('parler', true), v('chanter', true), v('regarder', true)
      ],
      imprimer: () => window.print(),
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); }
    };
  }
}
</script>
</body>
</html>
