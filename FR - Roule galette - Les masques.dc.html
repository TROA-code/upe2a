<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="polices.css" />
<style>body{margin:0;font-family:Andika, Archivo, Verdana, sans-serif;color:#12233b}a{color:#c1440e}a:hover{color:#12233b}@media print{.bouton{display:none !important}}</style>
</helmet>
<button class="bouton" onClick="{{ retour }}" style="position:fixed;top:12px;left:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#12233b;color:#fff;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer">← Retour</button>
<button class="bouton" onClick="{{ imprimer }}" style="position:fixed;top:12px;right:12px;z-index:10;min-height:44px;border:none;border-radius:10px;background:#2a7d4f;color:#fff;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer">Imprimer</button>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="a4" hint-size="100%,100%">
<sc-for list="{{ masques }}" as="m" hint-placeholder-count="7">
<section class="page" data-screen-label="{{ m.num }}" style="box-sizing:border-box;padding:20mm;font-family:Andika, Archivo, Verdana, sans-serif;font-size:14pt;color:#12233b;background:#fff;display:flex;flex-direction:column;gap:6mm">
<div style="display:flex;align-items:center;justify-content:space-between;gap:4mm;border-bottom:2px solid #c1440e;padding-bottom:3mm">
<span style="font-family:Archivo Black, Archivo, sans-serif;font-size:26pt;color:#c1440e">{{ m.nom }}</span>
<span style="font-size:12pt;color:#4a5568">Roule galette · les masques</span>
</div>
<div style="flex:0 0 auto;width:170mm;height:198mm;position:relative;overflow:hidden">
<img src="{{ m.img }}" alt="" style="position:absolute;left:{{ m.x }};top:{{ m.y }};width:{{ m.s }};height:{{ m.s }};max-width:none" />
</div>
<div style="display:flex;flex-direction:column;gap:3mm">
<div style="display:flex;align-items:center;gap:4mm"><img src="clean/pictos/ciseaux.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><span style="font-size:14pt;font-weight:700">Je découpe le masque et les yeux.</span></div>
<div style="display:flex;align-items:center;gap:4mm"><img src="clean/pictos/trace.webp" alt="" style="width:12mm;height:12mm;object-fit:contain" /><span style="font-size:14pt;font-weight:700">Je fais un trou de chaque côté, j'attache l'élastique.</span></div>
</div>
</section>
</sc-for>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = [['vieux', 'LE VIEUX'], ['vieille', 'LA VIEILLE'], ['galette', 'LA GALETTE'], ['lapin', 'LE LAPIN'], ['loup', 'LE LOUP'], ['ours', "L'OURS"], ['renard', 'LE RENARD']];
    return {
      imprimer: () => window.print(),
      retour: () => { const av = location.href; history.back(); setTimeout(() => { if (location.href === av) location.href = 'APPLI - Espace enseignant.dc.html' + location.search; }, 400); },
      /* 11/10 « les masques sont bien trop petits » : chaque masque est agrandi jusqu'à toucher les 2 cm de marge
         (170 × 198 mm). B = bords du dessin dans l'image, en % (mesurés sur les fichiers). */
      masques: L.map(([f, nom], i) => {
        const B = { vieux: [14, 88, 8, 89], vieille: [8, 94, 4, 81], galette: [6, 94, 6, 93], lapin: [8, 91, 8, 90], loup: [7, 92, 7, 93], ours: [4, 95, 8, 91], renard: [9, 90, 5, 93] }[f];
        const W = 170, H = 198, S = Math.min(W / ((B[1] - B[0]) / 100), H / ((B[3] - B[2]) / 100));
        return { num: String(i + 1).padStart(2, '0'), nom, img: 'clean/masque-galette-' + f + '.webp',
          s: S.toFixed(1) + 'mm', x: (W / 2 - S * (B[0] + B[1]) / 200).toFixed(1) + 'mm', y: (H / 2 - S * (B[2] + B[3]) / 200).toFixed(1) + 'mm' };
      })
    };
  }
}
</script>
</body>
</html>
